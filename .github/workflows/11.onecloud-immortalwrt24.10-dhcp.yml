#========================================================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Use Releases file to packaging
# Cron: min (0 - 59) / hour (0 - 23) / day of month (1 - 31) / month (1 - 12) / day of week (0 - 6)(Sunday - Saturday)
#========================================================================================================================
name: 11.Onecloud-Immortalwrt24.10直刷包编译DHCP

on:
  workflow_dispatch:
    inputs:
      REPO_VERSION:
        description: '选择源码Tag版本'
        required: true
        type: choice
        default: v24.10.6
        options:
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.REPO_VERSION }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-immortalwrt24.10.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  DIY_P3_SH: Scripts/false
  DIY_P4_SH: Scripts/false
  DIY_P5_SH: Scripts/false
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.6
  OWRT_CFG: Config/onecloud-immortalwrt24.10.config
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  Build_Burn_Firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 检查项目
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "OWRT_brun_type=$OWRT_brun_type" >> $GITHUB_ENV
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV

      - name: 克隆源仓库
        working-directory: /workdir
        run: |
          df -hT $PWD
          echo "==> 正在克隆Tag版本: $REPO_BRANCH"
          git clone $REPO_URL openwrt
          cd openwrt
          git checkout tags/$REPO_BRANCH
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 检查脚本
        run: |
          cd ./Scripts
          dos2unix ./*.sh
          chmod +x ./*.sh

      - name: 设置soc (amlogic6.6)
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          cd openwrt
          rm -rf target/linux/amlogic
          mv $GITHUB_WORKSPACE/lede6.6/target/linux/amlogic target/linux
          chmod -Rf 755 target/linux/amlogic
          ls -l target/linux/amlogic
          echo "amlogic6.6"

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

      - name: 安装订阅源
        run: |
          cd openwrt
          #更新到最新插件
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 加载自定义配置
        working-directory: ./openwrt
        run: |
          $GITHUB_WORKSPACE/$DIY_P2_SH
          if [[ "${DIY_P3_SH}" == *"false"* ]]; then
            echo "不需要执行此选项"
          else
            ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          fi

      - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
        working-directory: ./openwrt
        run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*
          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  ] && mv $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  .config
          #如果files文件夹不存在，创建文件夹
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files
          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi
          # DHCP 模式：不调用 edit_files.sh（该脚本会删除 network 并写入静态IP）
          echo "DHCP 模式，跳过 edit_files.sh"
          # 去掉多余的 dhcp 文件，让首次启动使用默认 dhcp 服务
          rm -f ./files/etc/config/dhcp
          #openclash 32
          if [[ "${DIY_P4_SH}" == *"false"* ]]; then
            echo "跳过 OpenClash 脚本 (DIY_P4_SH)"
          else
            $GITHUB_WORKSPACE/$DIY_P4_SH
          fi
          #python3.patch.sh
          if [[ "${DIY_P5_SH}" == *"false"* ]]; then
            echo "不需要执行此选项"
          else
            ${GITHUB_WORKSPACE}/${DIY_P5_SH}
          fi

      - name: 系统初始化：预置DHCP网络 + 首次启动自动扩容
        working-directory: ./openwrt
        run: |
          # ==========================================
          # 1. 预置默认网络配置 (DHCP + IPv6 + eth0桥接)
          # ==========================================
          mkdir -p ./files/etc/config
          cat > ./files/etc/config/network << 'EOF'
          config interface 'loopback'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'
          	option device 'lo'
          config globals 'globals'
          	option packet_steering '1'
          config interface 'lan'
          	option proto 'dhcp'
          	option device 'br-lan'
          	option sendclientid 'auto'
          	option multipath 'off'
          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0'
          config interface 'lan6'
          	option proto 'dhcpv6'
          	option device 'br-lan'
          	option reqaddress 'try'
          	option reqprefix 'auto'
          	option norelease '1'
          	option sendclientid 'auto'
          	option multipath 'off'
          EOF
          echo "已预置 DHCP + IPv6 网络配置"

          # ==========================================
          # 2. 首次启动自动扩容根目录 (针对玩客云 eMMC)
          # ==========================================
          mkdir -p ./files/etc/uci-defaults
          cat > ./files/etc/uci-defaults/99-resize-rootfs << 'RESIZE'
          #!/bin/sh
          resize2fs /dev/mmcblk1p2
          exit 0
          RESIZE
          chmod 755 ./files/etc/uci-defaults/99-resize-rootfs
          echo "已配置首次开机自动扩容（uci-defaults 机制，执行后自删）"

      - name: 下载编译环境
        working-directory: ./openwrt
        run: |
          # 确保生成 rootfs.tar.gz 在线升级包
          if grep -q "CONFIG_TARGET_ROOTFS_TARGZ" .config; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_TARGZ.*/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          fi
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 获取内核版本
        working-directory: ./openwrt
        run: |
          KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
          if [ -n "$KERNEL_PKG" ]; then
            KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
          else
            KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
          fi
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER="unknown"
          fi
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "获取到的内核版本为: $KERNEL_VER"

      - name: 备份原生rootfs升级包(防止打包脚本清理)
        working-directory: ./openwrt
        run: |
          mkdir -p /workdir/rootfs_backup
          # 兼容 rootfs.tar.gz 与 rootfs.tar 两种产物
          find bin/targets/ -type f -name "*rootfs.tar.gz" -exec cp -f {} /workdir/rootfs_backup/ \;
          find bin/targets/ -type f -name "*rootfs.tar"   -exec cp -f {} /workdir/rootfs_backup/ \;
          echo "=== 已备份的 rootfs 包 ==="
          ls -lh /workdir/rootfs_backup/

      - name: 制作直刷包
        # 注意：这里不要再写 "|| true"。
        # convert2.sh 内部已做“去回读校验 + 成品自检”，一旦自检不通过就必须让
        # 整个 job 失败，否则会把烧录时必报“校验错误”的坏包上传到 Release。
        env:
          KEEP_VERIFY: '0'          # 0=去掉烧录后 SHA1 回读校验（解决“校验错误”）
          DROP_VERIFY_ITEMS: '1'    # 1=同时丢弃容器里的 VERIFY 项
          BOOT_SIZE_MB: '2000'      # boot 分区镜像大小，与原脚本保持一致
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
          dos2unix $GITHUB_WORKSPACE/Scripts/convert2.sh
          $GITHUB_WORKSPACE/Scripts/convert2.sh

      - name: 校验直刷包结构(防空包/防回退)
        run: |
          cd openwrt
          xzfile=$(find bin/targets -type f -name "*burn.img.xz" | head -n 1)
          [ -n "$xzfile" ] || { echo "::error::没有生成 burn.img.xz"; exit 1; }
          echo "成品: $xzfile"
          ls -lh "$xzfile" "$xzfile".sha 2>/dev/null || true
          # 解压后回读容器，确认里面没有 [LIST_VERIFY] / VERIFY 项
          cp -f "$xzfile" /tmp/verify.burn.img.xz
          unxz -f /tmp/verify.burn.img.xz
          $GITHUB_WORKSPACE/Scripts/convert2.sh check /tmp/verify.burn.img
          rm -f /tmp/verify.burn.img


      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          mkdir -p outfile
          # 1. 先精确找到真正的直刷包和校验文件（忽略任何已经带前缀的，防止死循环）
          BURN_NAME="OneCloud_${KERNEL_VER}_immortalwrt-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"

          # 查找原始的 xz 包
          for file in $(find bin/targets/ -type f -name "*burn.img.xz" ! -name "OneCloud_*"); do
            if [ -f "$file" ]; then
              BASE_NAME=$(basename "$file")
              cp -f "$file" "./outfile/$BURN_NAME"

              # 查找与之对应的 sha 包
              SHA_FILE="${file%.xz}.sha"
              if [ -f "$SHA_FILE" ]; then
                NEW_SHA_NAME="${BURN_NAME}.sha"
                cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
                # 替换 sha 文件内部记录的旧文件名
                sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
              fi
            fi
          done
          # 2. 清理可能存在的其他无用 sha，防止被一起上传
          rm -f ./outfile/immortalwrt-*.sha
          # 3. 复制打包前备份的 rootfs 升级包
          cp -rf /workdir/rootfs_backup/* ./outfile/ 2>/dev/null || true
          cp -rf .config ./outfile/config.txt
          cd outfile
          KERNEL_VER=${{ env.KERNEL_VER }}
          # ===== 4. 重命名 rootfs 在线升级包 =====
          ROOTFS_NAME="OneCloud_${KERNEL_VER}_immortalwrt-amlogic-meson8b-thunder-rootfs.tar.gz"
          for file in *rootfs.tar.gz; do
            [ -f "$file" ] || continue
            [ "$file" = "$ROOTFS_NAME" ] && continue
            mv "$file" "$ROOTFS_NAME"
          done
          for file in *rootfs.tar; do
            [ -f "$file" ] || continue
            gzip -f "$file"
            mv "${file}.gz" "$ROOTFS_NAME"
          done
          echo "=== 最终发布文件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          #信息
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 上传直刷固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
          body: |
            自用玩客云一站式直刷固件[${{ env.OWRT_brun_type }}]！
            请使用双USB公头线刷机！
            ==========🧊 基本信息 🧊==========
            💻 固件源码： ${{env.OWRT_SOURCE}}
            💝 源码Tag： ${{ env.OWRT_BRANCH }}
            🧠 内核版本： ${{ env.KERNEL_VER }}
            🔑 默认密码： password
            🌐 默认地址： DHCP（请在路由器管理页面查看设备IP）
          artifacts: ${{ env.FIRMWARE }}/*

      - name: 清理Releases
        uses: rmoyulong/delete-older-releases@master
        with:
          keep_latest: 10
          delete_tags: true

      - name: 清理Workflows
        uses: rmoyulong/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
