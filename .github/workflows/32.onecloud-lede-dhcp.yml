#========================================================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Use Releases file to packaging
# Cron: min (0 - 59) / hour (0 - 23) / day of month (1 - 31) / month (1 - 12) / day of week (0 - 6)(Sunday - Saturday)
#========================================================================================================================
name: 32.onecloud-lede直刷包编译DHCP-自选内核

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '内核版本：6.6 系列=ImmortalWrt 24.10（稳定，推荐）；6.12=ImmortalWrt 25.12（需派生适配，实验性）'
        required: true
        type: choice
        # 6.6 = ImmortalWrt 24.10 稳定版那条线，amlogic 有官方 config-6.6 / patches-6.6；
        # 6.12 = ImmortalWrt 25.12 那条线，amlogic 没适配，由 6.6 打底 + 6.18 部分补丁派生。
        # 不再提供 6.18：lede 的默认值，太新，kmod、openclash 等依赖常编不过。
        default: '6.6.133'
        options:
          # ImmortalWrt v24.10.6 发行版使用的内核，amlogic 官方适配，最稳
          - '6.6.133'
          # ImmortalWrt openwrt-24.10 分支当前的内核
          - '6.6.159'
          # lede master 里 6.6 系列的当前版本，与 amlogic/patches-6.6 完全同步
          - '6.6.162'
          - '6.6.161'
          - '6.6.160'
          - '6.6.158'
          # ImmortalWrt v25.12.2 发行版使用的内核。amlogic 无官方适配，
          # 由 6.6 的 config/patches + 6.18 的 300/400/901 + 手工移植的 904 派生，
          # 已在 linux-6.12.103 原始源码上验证 10 个补丁全部干净应用。
          - '6.12.103'

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-lede6.18.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  #DIY_P3_SH: Scripts/false
  #DIY_P4_SH: Scripts/openclash32.sh
  #DIY_P5_SH: Scripts/false
  DIY_P6_SH: Scripts/edit_files.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  # Scripts/Settings.sh 里有一句 sed 会用 $OWRT_IP 替换 config_generate 的默认地址，
  # 变量为空会写出 ipaddr=''，所以这里固定给一个值。它只影响出厂兜底配置，
  # 真正生效的是下面 files/etc/config/network 里的 DHCP/DHCPv6。
  OWRT_IP: '192.168.8.59'
  OWRT_NAME: OneCloud
  # 下拉框选中值 → 脚本里按三段拆成 主版本(6.6) + 小版本(.133)
  KERNEL_VERSION_TARGET: ${{ inputs.kernel_version }}
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.18
  TZ: Asia/Shanghai

jobs:
  Build_burn_firmware:
    runs-on: ubuntu-latest

    steps:
    - name: 清理服务器空间(Ubuntu)
      uses: rmoyulong/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 检查项目
      uses: actions/checkout@main

    - name: 检查分配的服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

    - name: 初始化变量
      run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          
          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_TYPE=$OWRT_TYPE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          #echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV          
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          
          echo "OWRT_brun_type=$OWRT_brun_type" >> $GITHUB_ENV
          echo ${{ env.OWRT_brun_type }}
          
          OWRT_CFG="Config/onecloud-lede6.18.config"            
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV

    - name: 克隆源仓库
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
    - name: 检查脚本
      run: |
        cd ./Scripts
        dos2unix ./*.sh
        chmod +x ./*.sh          
        
    - name: 设置soc
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        cd openwrt 
        ls -l target/linux/amlogic
        echo "amlogic6.18"

    - name: 指定内核版本
      working-directory: ./openwrt
      run: |
        KMAJOR_NOW=$(grep -m1 '^KERNEL_PATCHVER:=' target/linux/amlogic/Makefile | cut -d= -f2 | tr -d ' ')
        KNOW=$(awk -v k="LINUX_VERSION-${KMAJOR_NOW}" '$1==k{print $3}' "include/kernel-${KMAJOR_NOW}" 2>/dev/null)

        FULL="${KERNEL_VERSION_TARGET}"
        if [ -z "$FULL" ]; then
          echo "未指定 KERNEL_VERSION_TARGET，跟随上游默认内核：${KMAJOR_NOW}${KNOW}"
          exit 0
        fi

        # 必须是 X.Y.Z 三段，写两段(6.6)或四段都会在下面被拦下
        if ! echo "$FULL" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::KERNEL_VERSION_TARGET 必须是三段数字，例如 6.6.102，当前填的是：${FULL}"
          exit 1
        fi

        MAJOR="${FULL%.*}"     # 6.6    主版本：目录名、补丁目录、Makefile 只认两段
        PATCH=".${FULL##*.}"   # .102   小版本：写进 include/kernel-6.6

        KFILE="include/kernel-${MAJOR}"
        CFG="target/linux/amlogic/config-${MAJOR}"
        PATCHDIR="target/linux/amlogic/patches-${MAJOR}"

        if [ ! -e "$KFILE" ]; then
          echo "::error::${KFILE} 不存在，源码里没有 ${MAJOR} 这个内核系列"
          exit 1
        fi

        # amlogic 只适配了 5.15 / 6.1 / 6.6 / 6.18，没有 6.12。
        # 选 6.12（= ImmortalWrt 25.12 的内核）时用 6.6 的 config/patches 打底，
        # 再把 6.18 里那几个能在 6.12 上干净应用的补丁并进来。
        # 这套组合已在 linux-6.12.103 原始源码上逐个 patch 实测：10 个补丁 0 失败。
        if [ ! -e "$CFG" ] || [ ! -d "$PATCHDIR" ]; then
          BASE=""
          for v in $(ls target/linux/amlogic/config-* 2>/dev/null | sed 's#.*config-##' | sort -V); do
            [ "$(printf '%s\n%s\n' "$v" "$MAJOR" | sort -V | head -1)" = "$v" ] && BASE="$v"
          done
          if [ -z "$BASE" ]; then
            echo "::error::amlogic 没有 <= ${MAJOR} 的内核配置可供派生"
            exit 1
          fi
          echo "::warning::amlogic 未适配 ${MAJOR}，从 ${BASE} 派生 config/patches（实验性）"
          [ -e "$CFG" ] || cp -a "target/linux/amlogic/config-${BASE}" "$CFG"
          [ -d "$PATCHDIR" ] || cp -a "target/linux/amlogic/patches-${BASE}" "$PATCHDIR"

          if [ "$MAJOR" = "6.12" ] && [ -d "target/linux/amlogic/patches-6.18" ]; then
            # 6.18 独有的这几个补丁在 6.12 上能原样应用，直接借过来
            for p in 300-* 400-* 901-*; do
              src=$(ls target/linux/amlogic/patches-6.18/${p} 2>/dev/null | head -1)
              [ -n "$src" ] && cp "$src" "${PATCHDIR}/"
            done
            # 6.18 的 904 是按 6.18 的 stmmac_main.c 写的：6.12 里没有 stmmac_vlan_restore()，
            # STMMAC_FLAG 也少一位（BIT(12) 就是最后一位），所以换成按 6.12 源码重做的版本。
            cat > "${PATCHDIR}/904-net-stmmac-disable-hw-vlan-filter-on-meson8b.patch" <<'P904_EOF'
        --- a/drivers/net/ethernet/stmicro/stmmac/dwmac-meson8b.c
        +++ b/drivers/net/ethernet/stmicro/stmmac/dwmac-meson8b.c
        @@ -427,6 +427,8 @@
         	if (IS_ERR(plat_dat))
         		return PTR_ERR(plat_dat);

        +	plat_dat->flags |= STMMAC_FLAG_NO_HW_VLAN_FILTER;
        +
         	dwmac = devm_kzalloc(&pdev->dev, sizeof(*dwmac), GFP_KERNEL);
         	if (!dwmac)
         		return -ENOMEM;
        --- a/drivers/net/ethernet/stmicro/stmmac/stmmac_main.c
        +++ b/drivers/net/ethernet/stmicro/stmmac/stmmac_main.c
        @@ -7663,19 +7663,21 @@
         	ndev->watchdog_timeo = msecs_to_jiffies(watchdog);
         #ifdef STMMAC_VLAN_TAG_USED
         	/* Both mac100 and gmac support receive VLAN tag detection */
        -	ndev->features |= NETIF_F_HW_VLAN_CTAG_RX | NETIF_F_HW_VLAN_STAG_RX;
        -	if (priv->plat->has_gmac4) {
        -		ndev->hw_features |= NETIF_F_HW_VLAN_CTAG_RX;
        -		priv->hw->hw_vlan_en = true;
        -	}
        -	if (priv->dma_cap.vlhash) {
        -		ndev->features |= NETIF_F_HW_VLAN_CTAG_FILTER;
        -		ndev->features |= NETIF_F_HW_VLAN_STAG_FILTER;
        -	}
        -	if (priv->dma_cap.vlins) {
        -		ndev->features |= NETIF_F_HW_VLAN_CTAG_TX;
        -		if (priv->dma_cap.dvlan)
        -			ndev->features |= NETIF_F_HW_VLAN_STAG_TX;
        +	if (!(priv->plat->flags & STMMAC_FLAG_NO_HW_VLAN_FILTER)) {
        +		ndev->features |= NETIF_F_HW_VLAN_CTAG_RX | NETIF_F_HW_VLAN_STAG_RX;
        +		if (priv->plat->has_gmac4) {
        +			ndev->hw_features |= NETIF_F_HW_VLAN_CTAG_RX;
        +			priv->hw->hw_vlan_en = true;
        +		}
        +		if (priv->dma_cap.vlhash) {
        +			ndev->features |= NETIF_F_HW_VLAN_CTAG_FILTER;
        +			ndev->features |= NETIF_F_HW_VLAN_STAG_FILTER;
        +		}
        +		if (priv->dma_cap.vlins) {
        +			ndev->features |= NETIF_F_HW_VLAN_CTAG_TX;
        +			if (priv->dma_cap.dvlan)
        +				ndev->features |= NETIF_F_HW_VLAN_STAG_TX;
        +		}
         	}
         #endif
         	priv->msg_enable = netif_msg_init(debug, default_msg_level);
        --- a/include/linux/stmmac.h
        +++ b/include/linux/stmmac.h
        @@ -181,6 +181,7 @@
         #define STMMAC_FLAG_RX_CLK_RUNS_IN_LPI		BIT(10)
         #define STMMAC_FLAG_EN_TX_LPI_CLOCKGATING	BIT(11)
         #define STMMAC_FLAG_HWTSTAMP_CORRECT_LATENCY	BIT(12)
        +#define STMMAC_FLAG_NO_HW_VLAN_FILTER		BIT(13)

         struct plat_stmmacenet_data {
         	int bus_id;
        P904_EOF
          fi
        fi

        # 内核 tarball 的 sha256 从 kernel.org 官方清单取，download.pl 下载时要用它校验
        HASH=$(curl -fsSL --retry 3 --max-time 60 "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR%%.*}.x/sha256sums.asc" \
                 | awk -v f="linux-${FULL}.tar.xz" '$2==f{print $1; exit}')
        if [ "${#HASH}" -ne 64 ]; then
          echo "::warning::没取到 linux-${FULL} 的官方 sha256，改用 skip 跳过 tarball 校验"
          HASH="skip"
        fi

        # ① 平台 Makefile 只能写两段主版本
        sed -i "s/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=${MAJOR}/" target/linux/amlogic/Makefile
        sed -i "s/^KERNEL_TESTING_PATCHVER:=.*/KERNEL_TESTING_PATCHVER:=${MAJOR}/" target/linux/amlogic/Makefile

        # ② 小版本落在 include/kernel-X.Y 的两行里：版本号 + 官方 sha256
        sed -i "s/^LINUX_VERSION-${MAJOR} = .*/LINUX_VERSION-${MAJOR} = ${PATCH}/" "$KFILE"
        sed -i "/^LINUX_KERNEL_HASH-${MAJOR}\./d" "$KFILE"
        echo "LINUX_KERNEL_HASH-${FULL} = ${HASH}" >> "$KFILE"

        echo "===== 已锁定内核版本 ${FULL} ====="
        grep -n 'KERNEL_PATCHVER' target/linux/amlogic/Makefile
        cat "$KFILE"

    - name: 强力清理luci-app残留
      working-directory: ./openwrt
      run: |
        # 1. 删除所有已克隆的 luci-app 目录
        find feeds/luci/applications -name "luci-app-*" -type d -exec rm -rf {} + 2>/dev/null || true
        find package -name "luci-app-*" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # 2. 删除 feeds 中的代理相关包
        rm -rf feeds/packages/net/hysteria
        rm -rf feeds/packages/net/xray-core
        rm -rf feeds/packages/net/v2ray-core
        rm -rf feeds/packages/net/v2ray-geodata
        rm -rf feeds/packages/net/sing-box
        
        # 3. 删除 ssr-plus 相关
        rm -rf feeds/luci/applications/luci-app-ssr-plus
        rm -rf package/helloworld
        
        # 4. 删除 OpenClash 相关
        rm -rf feeds/luci/applications/luci-app-openclash
        rm -rf package/luci-app-openclash
        
        # 5. 删除 amlogic 主题
        rm -rf package/luci-app-amlogic
        
        # 6. 清理 homeproxy
        rm -rf feeds/luci/applications/luci-app-homeproxy
        
        echo "✅ luci-app 清理完成"
        ls -la feeds/luci/applications/ 2>/dev/null || echo "feeds/luci/applications 目录已清空"
 
    - name: 启动缓存[第二次起生效]
      uses: rmoyulong/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}_k${{ env.KERNEL_VERSION_TARGET }}
      
  
    - name: 安装订阅源
      run: |
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV      
        
    - name:  加载自定义配置
      working-directory: ./openwrt
      run: |          
          $GITHUB_WORKSPACE/$DIY_P2_SH
         
          #if [[ "${DIY_P3_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          #fi 
               
    - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
      working-directory: ./openwrt
      run: | 
          #dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          #chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*
          
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/etc/aria2
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/aria2
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/aria2/download
          #chmod -R 755 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/share
          
          rm -rf ./tmp* ./.config*
          if [ -f "$GITHUB_WORKSPACE/$OWRT_CFG" ]; then
              cp -f "$GITHUB_WORKSPACE/$OWRT_CFG" .config
              echo "✅ 配置文件已成功覆盖: $OWRT_CFG"
          else
              echo "❌ 致命错误：找不到配置文件 $GITHUB_WORKSPACE/$OWRT_CFG"
              exit 1
          fi
          
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi          
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files
          
          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi

          # =====================================================================
          # ★ 关键修改：网口改「双栈自动获取」
          #   IPv4 → lan  : proto dhcp    （从上游主路由拿 IPv4 地址）
          #   IPv6 → lan6 : proto dhcpv6  （向上游请求 IPv6 地址/前缀，由 odhcp6c 处理 RA）
          #
          # 原因：原来这里调用 Scripts/edit_files.sh，该脚本用 heredoc 写入
          #   option proto 'static' / option ipaddr ... / option gateway ...
          # 所以固件启动后永远是静态 IP。这里不再调用它，直接生成 DHCP 版 network，
          # 覆盖 onecloud/files 里自带的静态 network。
          # =====================================================================
          # $GITHUB_WORKSPACE/$DIY_P6_SH

          mkdir -p ./files/etc/config
          rm -f ./files/etc/config/network
          cat > ./files/etc/config/network <<'NET_EOF'
            config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

            config globals 'globals'
              option packet_steering '1'

            config interface 'lan'
              option device 'br-lan'
              option proto 'dhcp'
              option hostname 'OneCloud'
              option broadcast '1'

            # IPv6：同一个网口再作为 DHCPv6 客户端（@lan 表示跟随 lan 的底层设备 br-lan）
            # reqaddress 'try'  → 尽量向上游请求 IA_NA 地址，拿不到也不阻塞启动
            # reqprefix  'auto' → 顺带请求前缀 PD；只要地址、不需要 PD 时改成 'no'
            config interface 'lan6'
              option device '@lan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

            config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth0'
          NET_EOF

          # 原写法最后是 rm -rf ./files/etc/config/dhcp，让系统首次启动自己生成
          # （那是「静态 IP + 本机当 DHCP 服务器」的用法）。改成 DHCP 客户端后
          # 必须显式关掉 lan 上的 DHCP/RA 服务，否则会和上游主路由的 DHCP 打架，
          # 两台设备同时发地址会让整个局域网随机断网。
          rm -f ./files/etc/config/dhcp
          cat > ./files/etc/config/dhcp <<'DHCP_EOF'
            config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option filterwin2k '0'
              option localise_queries '1'
              option rebind_protection '0'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option nonegcache '0'
              option cachesize '10000'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'
              option nonwildcard '0'
              option localservice '1'

            config dhcp 'lan'
              option interface 'lan'
              option ignore '1'
              option dhcpv4 'disabled'
              option dhcpv6 'disabled'
              option ra 'disabled'

            config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          DHCP_EOF

          echo "===== 最终 network ====="
          cat ./files/etc/config/network
          echo "===== 最终 dhcp ====="
          cat ./files/etc/config/dhcp

          # OneCloud-docker 分支的 uhttpd 覆盖与 dhcp 删除逻辑已停用：
          # 现在 network / dhcp 均由本步骤统一生成，不要再覆盖。
          # $GITHUB_WORKSPACE/$DIY_P4_SH
          
          #if [[ "${DIY_P5_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P5_SH}
          #fi 
        
    - name: 下载编译环境
      working-directory: ./openwrt
      run: |      
          # ========== 补齐 IPv6 客户端组件 ==========
          # Config/onecloud-lede6.18.config 里没有显式打开 odhcp6c（DHCPv6 客户端）
          # 和 luci-proto-ipv6（LuCI 里能选到 DHCPv6 协议）。缺 odhcp6c 时，
          # lan6 的 proto dhcpv6 根本起不来（/sbin/odhcp6c 不存在），IPv6 拿不到地址。
          for sym in CONFIG_PACKAGE_odhcp6c CONFIG_PACKAGE_luci-proto-ipv6 CONFIG_PACKAGE_kmod-ipv6; do
            grep -q "^${sym}=y" .config || echo "${sym}=y" >> .config
          done

          make defconfig

          # 校验这两个符号在 defconfig 之后仍然保留（依赖不满足会被 defconfig 丢掉）
          for sym in CONFIG_PACKAGE_odhcp6c CONFIG_PACKAGE_luci-proto-ipv6; do
            if grep -q "^${sym}=y" .config; then
              echo "✅ ${sym} 已启用"
            else
              echo "::warning::${sym} 未启用，IPv6 可能无法获取地址"
            fi
          done

          # ========== 平台自检：配置文件必须与源码仓库的目标命名一致 ==========
          # coolsnowwolf/lede 的玩客云是 target=amlogic / subtarget=meson8b
          # 若 .config 里写的是其它源(如 ImmortalWrt 的 meson)的目标，make defconfig 会静默回退到 x86，白跑一小时
          OWRT_BOARD=$(grep -m1 '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          OWRT_SUBTARGET=$(grep -m1 '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
          echo "解析到的目标平台：${OWRT_BOARD} / ${OWRT_SUBTARGET}"
          if [ "${OWRT_BOARD}" != "amlogic" ] || [ "${OWRT_SUBTARGET}" != "meson8b" ]; then
            echo "❌ 致命错误：目标平台不是 amlogic/meson8b，与 ${OWRT_URL} 不匹配，终止编译！"
            exit 1
          fi
          echo "✅ 目标平台校验通过"

          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

    - name: 编译固件
      working-directory: ./openwrt
      run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV 
        
    # === 修改处 1：获取内核版本 ===
    - name: 获取内核版本
      working-directory: ./openwrt
      run: |     
        KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
        if [ -n "$KERNEL_PKG" ]; then
          KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
        else
          KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
        fi
        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER="unknown"
        fi
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "获取到的内核版本为: $KERNEL_VER"

    - name: 制作直刷包
      # 注意：这里不要再写 "|| true"。
      # convert2.sh 内部已做“去回读校验 + 成品自检”，一旦自检不通过就必须让
      # 整个 job 失败，否则会把烧录时必报“校验错误”的坏包上传到 Release。
      env:
          KEEP_VERIFY: '0'          # 0=去掉烧录后 SHA1 回读校验（解决“校验错误”）
          DROP_VERIFY_ITEMS: '1'    # 1=同时丢弃容器里的 VERIFY 项
          BOOT_SIZE_MB: '2000'      # boot 分区镜像大小，与原脚本保持一致
      run: |
            chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
            dos2unix $GITHUB_WORKSPACE/Scripts/convert2.sh
            $GITHUB_WORKSPACE/Scripts/convert2.sh

    - name: 校验直刷包结构(防空包/防回退)
      run: |
          cd openwrt
          xzfile=$(find bin/targets -type f -name "*burn.img.xz" | head -n 1)
          [ -n "$xzfile" ] || { echo "::error::没有生成 burn.img.xz"; exit 1; }
          echo "成品: $xzfile"
          ls -lh "$xzfile" "$xzfile".sha 2>/dev/null || true
          # 解压后回读容器，确认里面没有 [LIST_VERIFY] / VERIFY 项
          cp -f "$xzfile" /tmp/verify.burn.img.xz
          unxz -f /tmp/verify.burn.img.xz
          $GITHUB_WORKSPACE/Scripts/convert2.sh check /tmp/verify.burn.img
          rm -f /tmp/verify.burn.img
          
    # === 修改处 2：重命名固件并整理格式（完全照抄你失败的工作流） ===
    - name: 整理固件
      id: organize
      run: |
        cd openwrt
        mkdir -p outfile
        
        # 1. 处理直刷包，强制使用标准命名并同步修改 sha
        for f in $(find bin/targets/ -type f -name "*.burn.img.xz"); do
          if [ -f "$f" ]; then
            NEW_XZ_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"
            cp -f "$f" "./outfile/${NEW_XZ_NAME}"
            
            # 查找对应的 .sha 文件 (兼容 .xz.sha 和 .img.sha)
            SHA_FILE="${f}.sha"
            [ -f "$SHA_FILE" ] || SHA_FILE="${f%.xz}.sha"
            
            if [ -f "$SHA_FILE" ]; then
              NEW_SHA_NAME="${NEW_XZ_NAME}.sha"
              cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
              # 修改内部记录的文件名为新名字
              sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
              # 如果内部记录的是 xz 名字，也替换掉
              sed -i "s|$(basename $f)|$NEW_XZ_NAME|g" "./outfile/$NEW_SHA_NAME"
            fi
          fi
        done
        
        # 2. 查找并生成 rootfs 在线升级包
        FOUND_ROOTFS=$(find bin/targets/amlogic -type f -name "*rootfs.tar*" | head -n 1)
        if [ -n "$FOUND_ROOTFS" ]; then
          ROOTFS_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-rootfs.tar.gz"
          if [[ "$FOUND_ROOTFS" == *.gz ]]; then
            cp -f "$FOUND_ROOTFS" "./outfile/$ROOTFS_NAME"
          else
            gzip -c "$FOUND_ROOTFS" > "./outfile/$ROOTFS_NAME"
          fi
          echo "✅ 成功找到并处理了 rootfs 文件: $FOUND_ROOTFS"
        else
          echo "⚠️ 警告：在 bin/targets/ 中没有找到任何 rootfs.tar 文件！"
        fi

        cp -rf .config ./outfile/config.txt || true
        cd outfile
        
        if ls *.xz >/dev/null 2>&1; then
          echo "=== 检查最终上传的固件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        else
          echo "❌ 错误：没有找到任何 .burn.img.xz 固件！"
          exit 1
        fi
        echo "::set-output name=status::success"

        export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
        export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
        echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
        echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

    # === 修改处 3：上传 Release 时的 Tag 和显示信息（照抄你的失败工作流） ===
    - name: 上传直刷固件
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
        body: |
          自用玩客云一站式直刷固件！
          请使用双USB公头线刷机！
          ==========🧊 基本信息 🧊==========
          💻 固件源码： ${{env.OWRT_SOURCE}}
          💝 源码分支： ${{ env.OWRT_BRANCH }}
          🧠 内核版本： ${{ env.KERNEL_VER }}
          🔑 默认密码： password
          🌐 网络模式： 网口双栈自动获取
          📶 IPv4： lan 口 DHCP 客户端，地址由上级路由分配
          📶 IPv6： lan6 口 DHCPv6 客户端，向上游请求地址（含 PD 前缀）
          📡 查看地址： 登录主路由后台 → 客户端/在线设备列表 → 找主机名 OneCloud
          💡 提示： 上游需开启 DHCP / DHCPv6（光猫或路由的 IPv6 要放行），否则对应协议拿不到地址
        artifacts: ${{ env.FIRMWARE }}/*
        
    - name: 清理Releases
      uses: rmoyulong/delete-older-releases@master
      with:
        keep_latest: 10
        delete_tags: true

    - name: 清理Workflows
      uses: rmoyulong/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
