#========================================================================================================================
# 独立编译 OneCloud amlogic6.6 直刷包
#========================================================================================================================
name: Onecloud-Immortalwrt24.10.6直刷包编译

on:
  workflow_dispatch:
    inputs:
      REPO_VERSION:
        description: '选择源码Tag版本'
        required: true
        type: choice
        default: v24.10.6
        options:
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
      OP_IP:
        description: '玩客云IP选项 (默认静态IP，进后台后可改DHCP)'
        required: true
        default: '192.168.8.59'
        type: string
      SERVER_IP:
        description: '主路由IP选项'
        required: true
        default: '192.168.8.1'
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.REPO_VERSION }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-immortalwrt24.10-burn.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  DIY_P3_SH: Scripts/false
  DIY_P4_SH: Scripts/false
  DIY_P5_SH: Scripts/false
  DIY_P6_SH: Scripts/edit_files.sh
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.6
  OWRT_CFG: Config/onecloud-immortalwrt24.10-burn.config
  OWRT_IP: ${{ github.event.inputs.OP_IP }}
  OWRT_SERVER_IP: ${{ github.event.inputs.SERVER_IP }}
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build_burn_firmware:
    runs-on: ubuntu-latest

    steps:
    - name: 清理服务器空间(Ubuntu)
      uses: rmoyulong/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 检查项目
      uses: actions/checkout@main

    - name: 检查分配的服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

    - name: 初始化变量
      run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)

          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "OWRT_IP=$OWRT_IP" >> $GITHUB_ENV
          echo "OWRT_SERVER_IP=$OWRT_SERVER_IP" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "OWRT_brun_type=amlogic6.6" >> $GITHUB_ENV
          echo "OWRT_CFG=Config/onecloud-immortalwrt24.10-burn.config" >> $GITHUB_ENV

    - name: 克隆源仓库
      working-directory: /workdir
      run: |
        df -hT $PWD
        echo "==> 正在克隆Tag版本: $REPO_BRANCH"
        git clone $REPO_URL openwrt
        cd openwrt
        git checkout tags/$REPO_BRANCH
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 检查脚本
      run: |
        cd ./Scripts
        dos2unix ./*.sh
        chmod +x ./*.sh

    - name: 设置soc (amlogic6.6)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default

        cd openwrt
        rm -rf target/linux/amlogic
        mv $GITHUB_WORKSPACE/lede6.6/target/linux/amlogic target/linux
        chmod -Rf 755 target/linux/amlogic
        ls -l target/linux/amlogic
        echo "amlogic6.6"

    - name: 启动缓存[第二次起生效]
      uses: rmoyulong/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: amlogic6.6/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

    - name: 安装订阅源
      run: |
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: 加载自定义配置
      working-directory: ./openwrt
      run: |
          $GITHUB_WORKSPACE/$DIY_P2_SH

          if [[ "${DIY_P3_SH}" == *"false"* ]]; then
            echo "不需要执行此选项"
          else
            ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          fi

    - name: 自定义IMAGS格式
      working-directory: ./openwrt
      run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*

          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/$OWRT_CFG ] && mv $GITHUB_WORKSPACE/$OWRT_CFG .config

          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files

          # 调用 edit_files.sh 并传入 IP 参数！
          $GITHUB_WORKSPACE/$DIY_P6_SH "${{ env.OWRT_IP }}" "${{ env.OWRT_SERVER_IP }}"

          if [[ "${DIY_P4_SH}" == *"false"* ]]; then
            echo "跳过 OpenClash 脚本 (DIY_P4_SH)"
          else
            $GITHUB_WORKSPACE/$DIY_P4_SH
          fi

    - name: 下载编译环境
      working-directory: ./openwrt
      run: |
          # 确保生成 rootfs.tar.gz 在线升级包
          if grep -q "CONFIG_TARGET_ROOTFS_TARGZ" .config; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_TARGZ.*/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          fi

          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

    - name: 编译固件
      working-directory: ./openwrt
      run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 获取内核版本
      working-directory: ./openwrt
      run: |
        KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
        if [ -n "$KERNEL_PKG" ]; then
          KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
        else
          KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
        fi
        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER="unknown"
        fi
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "获取到的内核版本为: $KERNEL_VER"

    - name: 备份原生rootfs升级包(防止打包脚本清理)
      working-directory: ./openwrt
      run: |
          mkdir -p /workdir/rootfs_backup
          # 兼容 rootfs.tar.gz 与 rootfs.tar 两种产物
          find bin/targets/ -type f -name "*rootfs.tar.gz" -exec cp -f {} /workdir/rootfs_backup/ \;
          find bin/targets/ -type f -name "*rootfs.tar"   -exec cp -f {} /workdir/rootfs_backup/ \;
          echo "=== 已备份的 rootfs 包 ==="
          ls -lh /workdir/rootfs_backup/

    - name: 制作直刷包
      run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2_24.sh
          $GITHUB_WORKSPACE/Scripts/convert2_24.sh || true

    - name: 整理固件
      id: organize
      run: |
        cd openwrt
        mkdir -p outfile

        # 1. 处理直刷包 burn.img.xz 及同步修改校验文件
        for f in $(find bin/targets/ -type f -name "*.burn.img.xz"); do
          if [ -f "$f" ]; then
            BASE_NAME=$(basename "$f")
            # 复制并重命名 .xz 文件
            cp -f "$f" "./outfile/OneCloud_${KERNEL_VER}_${BASE_NAME}"
            
            # 查找对应的 .sha 文件（原版通常是以 .burn.img.sha 结尾）
            SHA_FILE="${f%.xz}.sha"
            
            if [ -f "$SHA_FILE" ]; then
              SHA_BASE=$(basename "$SHA_FILE")
              NEW_SHA_NAME="OneCloud_${KERNEL_VER}_${SHA_BASE}"
              # 复制并重命名 .sha 文件
              cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
              # 修改 .sha 文件内部记录的原始文件名
              sed -i "s|$SHA_BASE|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
            fi
          fi
        done

        # 注意：千万不要在这加 cp -rf bin/targets/*/*/*.sha ./outfile
        # 因为那会把没改名的旧 sha 一起塞进去，导致白改名

        # 2. 打包前备份的 rootfs 升级包
        cp -rf /workdir/rootfs_backup/* ./outfile/ 2>/dev/null || true
        cp -rf .config ./outfile/config.txt || true

        cd outfile
        KERNEL_VER=${{ env.KERNEL_VER }}

        # 3. 重命名 rootfs 在线升级包
        ROOTFS_NAME="OneCloud_${KERNEL_VER}-immortalwrt-amlogic-meson8b-thunder-rootfs.tar.gz"
        for file in *rootfs.tar.gz; do
          [ -f "$file" ] || continue
          [ "$file" = "$ROOTFS_NAME" ] && continue
          mv "$file" "$ROOTFS_NAME"
        done
        for file in *rootfs.tar; do
          [ -f "$file" ] || continue
          gzip -f "$file"
          mv "${file}.gz" "$ROOTFS_NAME"
        done

        if ls *.xz >/dev/null 2>&1; then
          echo "=== 检查最终上传的固件 ==="
          ls -l
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        else
          echo "❌ 错误：没有找到任何 .burn.img.xz 固件！"
          exit 1
        fi
        echo "::set-output name=status::success"

        export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
        export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
        echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
        echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
    - name: 上传直刷固件
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        makeLatest: false
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
        body: |
          自用玩客云一站式直刷固件！
          请使用双USB公头线刷机！
          ==========🧊 基本信息 🧊==========
          💻 固件源码： ${{env.OWRT_SOURCE}}
          💝 源码Tag： ${{ env.OWRT_BRANCH }}
          🧠 内核版本： ${{ env.KERNEL_VER }}
          🔑 默认密码： password
          🌐 默认地址： ${{env.OWRT_IP}}
        artifacts: ${{ env.FIRMWARE }}/*

    - name: 清理Releases
      uses: rmoyulong/delete-older-releases@master
      with:
        keep_latest: 10
        delete_tags: true

    - name: 清理Workflow运行记录
      uses: rmoyulong/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
#（注：内容由AI生成）

