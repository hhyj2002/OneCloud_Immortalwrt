#========================================================================================================================
# 独立编译 OneCloud lede6.18 直刷包
#========================================================================================================================
name: onecloud-lede6.18直刷包编译 2026.10.29

on:
  workflow_dispatch:
    inputs:
      OP_IP:
        description: '玩客云IP选项 (默认静态IP，进后台后可改DHCP)'
        required: true
        default: '192.168.8.59'
        type: string
      SERVER_IP:
        description: '主路由IP选项'
        required: true
        default: '192.168.8.1'
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-lede6.18-burn.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  DIY_P3_SH: Scripts/false
  DIY_P4_SH: Scripts/false
  DIY_P5_SH: Scripts/false
  DIY_P6_SH: Scripts/edit_files.sh
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.18
  OWRT_CFG: Config/onecloud-lede6.18-burn.config
  OWRT_IP: ${{ github.event.inputs.OP_IP }}
  OWRT_SERVER_IP: ${{ github.event.inputs.SERVER_IP }}
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build_burn_firmware:
    runs-on: ubuntu-latest

    steps:
    - name: 清理服务器空间(Ubuntu)
      uses: rmoyulong/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 检查项目
      uses: actions/checkout@main

    - name: 检查分配的服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          
          # LEDE 源码使用原生依赖安装
          sudo -E apt -yqq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libncursesw5-dev libssl-dev libelf-dev ecj fastjar \
            rsync swig unzip zlib1g-dev file wget python3 python3-pip python3-setuptools \
            python3-dev python3-yaml python3-venv dos2unix libfuse-dev libxml2 libffi-dev pkg-config \
            libpcre3 libpcre3-dev android-sdk-libsparse-utils

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

    - name: 初始化变量
      run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)

          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "OWRT_IP=$OWRT_IP" >> $GITHUB_ENV
          echo "OWRT_SERVER_IP=$OWRT_SERVER_IP" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "OWRT_brun_type=amlogic6.18" >> $GITHUB_ENV
          echo "OWRT_CFG=Config/onecloud-lede6.18-burn.config" >> $GITHUB_ENV

    - name: 克隆源仓库
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 检查脚本
      run: |
        cd ./Scripts
        dos2unix ./*.sh
        chmod +x ./*.sh
  
    - name: 设置soc (amlogic6.18)
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default

        cd openwrt
        rm -rf target/linux/amlogic
        mv $GITHUB_WORKSPACE/lede6.18/target/linux/amlogic target/linux
        chmod -Rf 755 target/linux/amlogic
        
        # 清理冲突补丁
        rm -f target/linux/generic/hack-6.18/95*-*.patch
        rm -f target/linux/generic/hack-6.18/64*-*.patch
        
        ls -l target/linux/amlogic
        echo "amlogic6.18"

    - name: 启动缓存[第二次起生效]
      uses: rmoyulong/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: amlogic6.18/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

    - name: 安装订阅源
      run: |
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: 加载自定义配置
      working-directory: ./openwrt
      run: |
          $GITHUB_WORKSPACE/$DIY_P2_SH

          if [[ "${DIY_P3_SH}" == *"false"* ]]; then
            echo "不需要执行此选项"
          else
            ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          fi

    - name: 自定义IMAGS格式
      working-directory: ./openwrt
      run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*

          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/$OWRT_CFG ] && mv $GITHUB_WORKSPACE/$OWRT_CFG .config

          # 强行注入 rootfs 配置，防止被 defconfig 冲掉
          sed -i 's/^# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/g' .config
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config

          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files

          # 调用 edit_files.sh 并传入 IP 参数
          $GITHUB_WORKSPACE/$DIY_P6_SH "${{ env.OWRT_IP }}" "${{ env.OWRT_SERVER_IP }}"

          if [[ "${DIY_P4_SH}" == *"false"* ]]; then
            echo "跳过 OpenClash 脚本 (DIY_P4_SH)"
          else
            $GITHUB_WORKSPACE/$DIY_P4_SH
          fi
    
    - name: 下载编译环境
      working-directory: ./openwrt
      run: |
          # 第一层保险
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          
          make defconfig
          
          # 第二层保险：defconfig 跑完后如果被自动关闭了，强行改回来
          sed -i 's/^# CONFIG_TARGET_ROOTFS_TARGZ is not set/CONFIG_TARGET_ROOTFS_TARGZ=y/g' .config
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;


    - name: 编译固件
      working-directory: ./openwrt
      run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 获取内核版本
      working-directory: ./openwrt
      run: |     
        KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
        if [ -n "$KERNEL_PKG" ]; then
          KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
        else
          KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
        fi
        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER="unknown"
        fi
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "获取到的内核版本为: $KERNEL_VER"
            
    - name: 制作直刷包
      run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2_18.sh
          $GITHUB_WORKSPACE/Scripts/convert2_18.sh || true

    - name: 整理固件
      id: organize
      run: |
        cd openwrt
        mkdir -p outfile
        
        # 1. 处理直刷包，强制使用标准命名并同步修改 sha
        for f in $(find bin/targets/ -type f -name "*.burn.img.xz"); do
          if [ -f "$f" ]; then
            # 直接固定最终名字，抛弃原本可能乱七八糟的 BASE_NAME
            NEW_XZ_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"
            cp -f "$f" "./outfile/${NEW_XZ_NAME}"
            
            # 查找对应的 .sha 文件
            SHA_FILE="${f%.xz}.sha"
            if [ -f "$SHA_FILE" ]; then
              NEW_SHA_NAME="${NEW_XZ_NAME}.sha"
              cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
              # 修改 .sha 文件内部记录的原始文件名
              sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
            fi
          fi
        done
        
        # 清理可能残留的旧名或错误名的 sha 文件，防止一起被上传
        rm -f ./outfile/immortalwrt-*.sha ./outfile/OneCloud*.burn.img.sha

        cp -rf .config ./outfile/config.txt || true

        cd outfile
        KERNEL_VER=${{ env.KERNEL_VER }}

        # ===== 2. 重命名 rootfs 在线升级包 =====
        ROOTFS_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-rootfs.tar.gz"
        for file in *rootfs.tar.gz; do
          [ -f "$file" ] || continue
          [ "$file" = "$ROOTFS_NAME" ] && continue
          mv "$file" "$ROOTFS_NAME"
        done
        for file in *rootfs.tar; do
          [ -f "$file" ] || continue
          gzip -f "$file"
          mv "${file}.gz" "$ROOTFS_NAME"
        done

        if ls *.xz >/dev/null 2>&1; then
          echo "=== 检查最终上传的固件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        else
          echo "❌ 错误：没有找到任何 .burn.img.xz 固件！"
          exit 1
        fi
        echo "::set-output name=status::success"

        export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
        export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
        echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
        echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
    
    - name: 上传直刷固件
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
        body: |
          自用玩客云一站式直刷固件！
          请使用双USB公头线刷机！
          ==========🧊 基本信息 🧊==========
          💻 固件源码： ${{env.OWRT_SOURCE}}
          💝 源码分支： ${{ env.OWRT_BRANCH }}
          🧠 内核版本： ${{ env.KERNEL_VER }}
          🔑 默认密码： password
          🌐 默认地址： ${{env.OWRT_IP}}
        artifacts: ${{ env.FIRMWARE }}/*
  
    - name: 清理Releases
      uses: rmoyulong/delete-older-releases@master
      with:
        keep_latest: 10
        delete_tags: true

    - name: 清理Workflow运行记录
      uses: rmoyulong/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
