#========================================================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Use Releases file to packaging
# Cron: min (0 - 59) / hour (0 - 23) / day of month (1 - 31) / month (1 - 12) / day of week (0 - 6)(Sunday - Saturday)
#========================================================================================================================
name: 51.Onecloud-Openwrt24.10直刷包编译DHCP+全量IPK

on:
  workflow_dispatch:
    inputs:
      REPO_VERSION:
        description: '选择源码Tag版本'
        required: true
        type: choice
        default: v24.10.8
        options:
          - v24.10.8
          - v24.10.7
          - v24.10.6
          - v24.10.5
          - v24.10.4
          - v24.10.3
          - v24.10.2
          - v24.10.1
          - v24.10.0

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: ${{ github.event.inputs.REPO_VERSION }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-immortalwrt24.10.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  #DIY_P3_SH: Scripts/false
  #DIY_P4_SH: Scripts/false
  #DIY_P5_SH: Scripts/false
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.6
  OWRT_CFG: Config/onecloud-immortalwrt24.10.config
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  Build_Burn_Firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 检查项目
        uses: actions/checkout@main

      - name: 初始化编译环境
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -yqq purge firefox
          sudo -E apt -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -yqq update
          sudo -E apt -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -yqq install dos2unix libfuse-dev \
          libxml2 python3-setools libffi-dev pkg-config lib32z1-dev libpcre3 \
          libpcre3-dev libncurses-dev ncurses-dev \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libncursesw5-dev libssl-dev make \
          swig unzip zlib1g-dev
          echo ">>> 基础包安装完成"
          # 静默执行官方脚本，失败时重跑一次并打印日志
          sudo bash -c 'bash <(curl -sL https://build-scripts.openwrt.org/init_build_environment.sh) > /dev/null 2>&1' || \
          sudo bash -c 'bash <(curl -sL https://build-scripts.openwrt.org/init_build_environment.sh)'
          echo ">>> 官方环境脚本执行完成"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -h /
          echo ">>> 初始化编译环境结束"

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          #echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "OWRT_brun_type=$OWRT_brun_type" >> $GITHUB_ENV
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV

      - name: 克隆源仓库
        working-directory: /workdir
        run: |
          df -hT $PWD
          echo "==> 正在克隆Tag版本: $REPO_BRANCH"
          git clone $REPO_URL openwrt
          cd openwrt
          git checkout tags/$REPO_BRANCH
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 检查脚本
        run: |
          cd ./Scripts
          dos2unix ./*.sh
          chmod +x ./*.sh

      - name: 设置soc (amlogic6.6)
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          cd openwrt
          rm -rf target/linux/amlogic
          mv $GITHUB_WORKSPACE/lede6.6/target/linux/amlogic target/linux
          chmod -Rf 755 target/linux/amlogic
          ls -l target/linux/amlogic
          echo "amlogic6.6"

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

      - name: 安装订阅源
        run: |
          cd openwrt
          #更新到最新插件
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 加载自定义配置
        working-directory: ./openwrt
        run: |
          $GITHUB_WORKSPACE/$DIY_P2_SH
          #if [[ "${DIY_P3_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          #fi

      - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
        working-directory: ./openwrt
        run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*
          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  ] && mv $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  .config
          #如果files文件夹不存在，创建文件夹
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files
          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi
          # DHCP 模式：不调用 edit_files.sh（该脚本会删除 network 并写入静态IP）
          echo "DHCP 模式，跳过 edit_files.sh"
          # 去掉多余的 dhcp 文件，让首次启动使用默认 dhcp 服务
          rm -f ./files/etc/config/dhcp
          #openclash 32
          #if [[ "${DIY_P4_SH}" == *"false"* ]]; then
          #  echo "跳过 OpenClash 脚本 (DIY_P4_SH)"
          #else
          # $GITHUB_WORKSPACE/$DIY_P4_SH
          #fi
          #python3.patch.sh
          #if [[ "${DIY_P5_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P5_SH}
          #fi

      - name: 系统初始化：预置DHCP网络 + 首次启动自动扩容
        working-directory: ./openwrt
        run: |
          # ==========================================
          # 1. 预置默认网络配置 (DHCP + IPv6 + eth0桥接)
          # ==========================================
          mkdir -p ./files/etc/config
          cat > ./files/etc/config/network << 'EOF'
          config interface 'loopback'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'
          	option device 'lo'
          config globals 'globals'
          	option packet_steering '1'
          config interface 'lan'
          	option proto 'dhcp'
          	option device 'br-lan'
          	option sendclientid 'auto'
          	option multipath 'off'
          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0'
          config interface 'lan6'
          	option proto 'dhcpv6'
          	option device 'br-lan'
          	option reqaddress 'try'
          	option reqprefix 'auto'
          	option norelease '1'
          	option sendclientid 'auto'
          	option multipath 'off'
          EOF
          echo "已预置 DHCP + IPv6 网络配置"

          # ==========================================
          # 2. 首次启动自动扩容根目录 (针对玩客云 eMMC)
          # ==========================================
          mkdir -p ./files/etc/uci-defaults
          cat > ./files/etc/uci-defaults/99-resize-rootfs << 'RESIZE'
          #!/bin/sh
          resize2fs /dev/mmcblk1p2
          exit 0
          RESIZE
          chmod 755 ./files/etc/uci-defaults/99-resize-rootfs
          echo "已配置首次开机自动扩容（uci-defaults 机制，执行后自删）"

      - name: 下载编译环境
        working-directory: ./openwrt
        run: |
          sed -i 's|https://sources.openwrt.org|https://mirrors.tuna.tsinghua.edu.cn/openwrt|g' include/download.mk
          sed -i 's|https://cdn.kernel.org/pub/linux/kernel|https://mirrors.tuna.tsinghua.edu.cn/kernel|g' include/download.mk

          # 确保生成 rootfs.tar.gz 在线升级包
          if grep -q "CONFIG_TARGET_ROOTFS_TARGZ" .config; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_TARGZ.*/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          fi
          # 仿官方发行版：编译对应源码发行版的全部 kmod 包 + 全部 package 包（生成 ipk 安装包）
          if grep -q "CONFIG_ALL_KMODS" .config; then
            sed -i 's/^CONFIG_ALL_KMODS.*/CONFIG_ALL_KMODS=y/' .config
          else
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          if grep -q "CONFIG_ALL_PACKAGES" .config; then
            sed -i 's/^CONFIG_ALL_PACKAGES.*/CONFIG_ALL_PACKAGES=y/' .config
          else
            echo "CONFIG_ALL_PACKAGES=y" >> .config
          fi
          make defconfig

          # 并行下载，失败降级单线程重试
          make download -j$(nproc) V=s || make download -j1 V=s

          # 清理下载不完整(<1k)的残包，强制重新拉取
          find dl -size -1k -exec rm -f {} \;

      - name: 预生成内核配置(防kconfig交互卡死)
        working-directory: ./openwrt
        run: |
          # ALL_KMODS 会启用 RC/Media/DVB 等大量内核子系统，而板级 config-6.6
          # 缺少部分新内核符号。OpenWrt 在 Kernel/Configure 合并生成内核 .config
          # 后立即开始编译，kbuild syncconfig 会对缺失符号弹出交互式提问，在 CI
          # 非交互环境中直接报错退出。这里给克隆源码树的 include/kernel-defaults.mk
          # 打补丁：在开始编译内核模块前先执行一次 olddefconfig，把所有缺失符号
          # 用默认值静默补全（只改克隆源码，不改本仓库任何文件）。
          python3 - <<'PYEOF'
          p = "include/kernel-defaults.mk"
          s = open(p).read()
          old = "define Kernel/CompileModules/Default\n\trm -f $(LINUX_DIR)/vmlinux $(LINUX_DIR)/System.map\n"
          new = "define Kernel/CompileModules/Default\n\t$(_SINGLE)$(KERNEL_MAKE) olddefconfig\n\trm -f $(LINUX_DIR)/vmlinux $(LINUX_DIR)/System.map\n"
          assert old in s, "kernel-defaults.mk 未找到目标代码，源码结构可能已变化"
          open(p, "w").write(s.replace(old, new, 1))
          print("[OK] 已在 Kernel/CompileModules 前注入 olddefconfig")
          PYEOF
          grep -n "olddefconfig" include/kernel-defaults.mk

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 获取内核版本
        working-directory: ./openwrt
        run: |
          KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
          if [ -n "$KERNEL_PKG" ]; then
            KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
          else
            KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
          fi
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER="unknown"
          fi
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "获取到的内核版本为: $KERNEL_VER"

      - name: 打包全部安装包(仿官方kmods目录命名)
        working-directory: ./openwrt
        run: |
          # ==========================================================
          # 收集本次编译产生的全部安装包（kmods + packages，24.10 为 ipk），
          # 仿官方 releases/<ver>/targets/<t>/<s>/kmods/<内核版本-1-哈希>/
          # 目录命名方式，全部压缩为一个 zip 随 Release 一并上传
          # ==========================================================
          # 1. 优先使用编译系统生成的 kmods 目录名（与官方格式完全一致）
          KMOD_DIR=$(find bin -type d -path "*kmods/*" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            KMOD_NAME=$(basename "$KMOD_DIR")
          else
            KMOD_NAME=""
          fi
          # 2. 兜底：内核版本-1-源码commit哈希(32位)
          if [ -z "$KMOD_NAME" ]; then
            SRC_HASH=$(git rev-parse HEAD | cut -c1-32)
            KMOD_NAME="${KERNEL_VER}-1-${SRC_HASH}"
          fi
          ZIP_NAME="${KMOD_NAME}.zip"
          echo "安装包压缩包名: $ZIP_NAME"

          # 3. 汇集全部安装包（按文件名去重，kmods 与 packages 合并）
          STAGE=/workdir/pkg_stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          find bin -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -n {} "$STAGE"/ \; 2>/dev/null || true
          PKG_COUNT=$(ls -1 "$STAGE" | wc -l)
          [ "$PKG_COUNT" -gt 0 ] || { echo "::error::没有找到任何 ipk/apk 安装包"; exit 1; }
          echo "共收集 $PKG_COUNT 个安装包"
          echo "=== 架构分布 ==="
          ls -1 "$STAGE" | sed -E 's/.*_([^_]+)\.(ipk|apk)$/\1/' | sort | uniq -c

          # 4. 生成仓库索引
          #    - 有 .apk（CONFIG_USE_APK）时：补签全部 apk 并生成 packages.adb，
          #      apk v3 索引签名内嵌在 adb 容器里，不会产生 .sig 文件
          #    - 24.10 默认 opkg/ipk：生成 Packages + Packages.gz，并用 usign 签名
          TOPDIR=$(pwd)
          HAS_APK=$(ls "$STAGE"/*.apk 2>/dev/null | wc -l)
          HAS_IPK=$(ls "$STAGE"/*.ipk 2>/dev/null | wc -l)
          echo "apk 包: $HAS_APK 个, ipk 包: $HAS_IPK 个"
          if [ "$HAS_APK" -gt 0 ] && [ "$HAS_IPK" -gt 0 ]; then
            echo "::warning::同时存在 apk 与 ipk，优先按 apk 生成 packages.adb（ipk 不建索引）"
          fi

          if [ "$HAS_APK" -gt 0 ]; then
            APK_BIN=""
            for c in staging_dir/host/bin/apk "$(command -v apk 2>/dev/null || true)"; do
              if [ -n "$c" ] && [ -x "$c" ]; then APK_BIN=$(readlink -f "$c"); break; fi
            done
            if [ -n "$APK_BIN" ]; then
              OPENSSL=$(command -v openssl 2>/dev/null || echo staging_dir/host/bin/openssl)
              if [ ! -s private-key.pem ]; then
                "$OPENSSL" ecparam -name prime256v1 -genkey -noout -out private-key.pem
              fi
              if [ ! -s public-key.pem ]; then
                "$OPENSSL" ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null
              fi
              # 注意：apk adbsign 一次传多个文件只会签第一个，必须逐文件调用
              echo "=== 给 ${HAS_APK} 个 apk 补签 ==="
              export APK_BIN TOPDIR
              if (cd "$STAGE" && find . -maxdepth 1 -name '*.apk' -print0 \
                    | xargs -0 -n 1 -P "$(nproc)" sh -c '"$APK_BIN" adbsign --keys-dir "$TOPDIR" --allow-untrusted --sign "$TOPDIR/private-key.pem" "$1" >/dev/null 2>&1' _); then
                echo "[OK] apk 补签完成"
              else
                echo "::warning::apk 补签失败，设备端安装时需加 --allow-untrusted"
              fi
              echo "=== 生成 packages.adb 索引 ==="
              if (cd "$STAGE" && "$APK_BIN" mkndx --root "$TOPDIR" --keys-dir "$TOPDIR" \
                    --allow-untrusted --sign "$TOPDIR/private-key.pem" \
                    --output packages.adb ./*.apk); then
                echo "[OK] packages.adb 已生成（签名内嵌）"
              else
                echo "::warning::packages.adb 生成失败"
                rm -f "$STAGE/packages.adb"
              fi
              cp -f public-key.pem "$STAGE/" 2>/dev/null || true
            else
              echo "::warning::未找到 apk 命令，跳过 packages.adb"
            fi
          elif [ "$HAS_IPK" -gt 0 ]; then
            # 24.10 默认 opkg/ipk：直接解析每个 ipk 的 control 生成 Packages，
            # 不依赖 scripts/ipkg-make-index.sh（该脚本的 sed 转义在部分 sed 版本下会报错）
            echo "=== 生成 opkg 索引 Packages ==="
            : > "$STAGE/Packages"
            for f in "$STAGE"/*.ipk; do
              b=$(basename "$f")
              case "$b" in
                kernel_*|libc_*) continue ;;
              esac
              if ! ctl=$(tar -xzOf "$f" ./control.tar.gz 2>/dev/null | tar -xzOf - ./control 2>/dev/null); then
                echo "::warning::无法解析 control，跳过: $b"
                continue
              fi
              printf '%s\n' "$ctl" | awk -v fn="$b" -v sz="$(stat -c%s "$f")" -v sh="$(sha256sum "$f" | cut -d' ' -f1)" '
                /^Description:/ && !done { print "Filename: " fn; print "Size: " sz; print "SHA256sum: " sh; done=1 }
                { print }' >> "$STAGE/Packages"
              echo "" >> "$STAGE/Packages"
            done
            if [ -s "$STAGE/Packages" ]; then
              gzip -9nc "$STAGE/Packages" > "$STAGE/Packages.gz"
              USIGN="$TOPDIR/staging_dir/host/bin/usign"
              if [ -x "$USIGN" ] && [ -s "$TOPDIR/key-build" ]; then
                if "$USIGN" -S -m "$STAGE/Packages" -s "$TOPDIR/key-build" >/dev/null 2>&1; then
                  echo "[OK] Packages 已签名（Packages.sig）"
                else
                  echo "::warning::Packages 签名失败"
                fi
                cp -f "$TOPDIR/key-build.pub" "$STAGE/" 2>/dev/null || true
              else
                echo "::warning::未找到 usign 或 key-build，Packages 未签名"
              fi
              IDX_N=$(grep -c '^Package:' "$STAGE/Packages" || true)
              echo "[OK] 索引收录 ${IDX_N} 个包"
            else
              echo "::warning::opkg 索引生成失败"
            fi
          fi

          # 5. 保留构建系统按官方布局生成的各目录索引
          #    packages/<arch>/<feed>/、targets/<b>/<s>/packages/、
          #    targets/<b>/<s>/kmods/<内核版本>-<rel>-<vermagic>/
          mkdir -p "$STAGE/official-index"
          while IFS= read -r f; do
            rel=${f#bin/}
            mkdir -p "$STAGE/official-index/$(dirname "$rel")"
            cp -f "$f" "$STAGE/official-index/$rel"
          done < <(find bin -type f \( -name "packages.adb" -o -name "Packages" -o -name "Packages.gz" -o -name "Packages.sig" \) 2>/dev/null)
          echo "官方布局索引文件数: $(find "$STAGE/official-index" -type f | wc -l)"

          # 6. 随包附带一份离线源使用说明
          cat > "$STAGE/README-PKG-REPO.txt" <<'EOF'
          离线软件源使用说明
          ==================
          apk 版（包内有 packages.adb）：
            echo "ndx file:///mnt/usb/repo/packages.adb" >> /etc/apk/repositories
            cp public-key.pem /etc/apk/keys/ && apk update

          opkg 版（包内有 Packages.gz，24.10 默认）：
            echo "src/gz local file:///mnt/usb/repo" >> /etc/opkg/customfeeds.conf
            opkg update

          kmod 必须与本机内核版本一致（apk info kernel / opkg info kernel 查看）。
          EOF

          # 7. 压缩打包（安装包本身已压缩，使用存储模式加快速度）
          rm -f "/workdir/${ZIP_NAME}"
          (cd "$STAGE" && zip -q -0 -r "/workdir/${ZIP_NAME}" ./*)
          du -sh "/workdir/${ZIP_NAME}"
          # GitHub Release 单文件上限 2GiB，超限则提前报错
          ZIP_BYTES=$(stat -c%s "/workdir/${ZIP_NAME}")
          if [ "$ZIP_BYTES" -gt 2147483647 ]; then
            echo "::error::安装包压缩包超过 2GiB 上限，无法上传 Release"
            exit 1
          fi
          echo "PKG_ZIP=/workdir/${ZIP_NAME}" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 备份原生rootfs升级包(防止打包脚本清理)
        working-directory: ./openwrt
        run: |
          mkdir -p /workdir/rootfs_backup
          # 兼容 rootfs.tar.gz 与 rootfs.tar 两种产物
          find bin/targets/ -type f -name "*rootfs.tar.gz" -exec cp -f {} /workdir/rootfs_backup/ \;
          find bin/targets/ -type f -name "*rootfs.tar"   -exec cp -f {} /workdir/rootfs_backup/ \;
          echo "=== 已备份的 rootfs 包 ==="
          ls -lh /workdir/rootfs_backup/

      - name: 制作直刷包
        # 注意：这里不要再写 "|| true"。
        # convert2-new.sh 内部已做“去回读校验 + 成品自检”，一旦自检不通过就必须让
        # 整个 job 失败，否则会把烧录时必报“校验错误”的坏包上传到 Release。
        env:
          KEEP_VERIFY: '0'          # 0=去掉烧录后 SHA1 回读校验（解决“校验错误”）
          DROP_VERIFY_ITEMS: '1'    # 1=同时丢弃容器里的 VERIFY 项
          BOOT_SIZE_MB: '2000'      # boot 分区镜像大小，与原脚本保持一致
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
          dos2unix $GITHUB_WORKSPACE/Scripts/convert2.sh
          $GITHUB_WORKSPACE/Scripts/convert2.sh

      - name: 校验直刷包结构(防空包/防回退)
        run: |
          cd openwrt
          xzfile=$(find bin/targets -type f -name "*burn.img.xz" | head -n 1)
          [ -n "$xzfile" ] || { echo "::error::没有生成 burn.img.xz"; exit 1; }
          echo "成品: $xzfile"
          ls -lh "$xzfile" "$xzfile".sha 2>/dev/null || true
          # 解压后回读容器，确认里面没有 [LIST_VERIFY] / VERIFY 项
          cp -f "$xzfile" /tmp/verify.burn.img.xz
          unxz -f /tmp/verify.burn.img.xz
          $GITHUB_WORKSPACE/Scripts/convert2.sh check /tmp/verify.burn.img
          rm -f /tmp/verify.burn.img

      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          mkdir -p outfile
          # 1. 先精确找到真正的直刷包和校验文件（忽略任何已经带前缀的，防止死循环）
          BURN_NAME="OneCloud_${KERNEL_VER}_openwrt-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"

          # 查找原始的 xz 包
          for file in $(find bin/targets/ -type f -name "*burn.img.xz" ! -name "OneCloud_*"); do
            if [ -f "$file" ]; then
              BASE_NAME=$(basename "$file")
              cp -f "$file" "./outfile/$BURN_NAME"

              # 查找与之对应的 sha 包
              SHA_FILE="${file%.xz}.sha"
              if [ -f "$SHA_FILE" ]; then
                NEW_SHA_NAME="${BURN_NAME}.sha"
                cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
                # 替换 sha 文件内部记录的旧文件名
                sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
              fi
            fi
          done
          # 2. 清理可能存在的其他无用 sha，防止被一起上传
          rm -f ./outfile/immortalwrt-*.sha
          # 3. 复制打包前备份的 rootfs 升级包
          cp -rf /workdir/rootfs_backup/* ./outfile/ 2>/dev/null || true
          # 4. 复制全部安装包压缩包（随 Release 一并上传）
          if [ -n "${PKG_ZIP}" ] && [ -f "${PKG_ZIP}" ]; then
            cp -f "${PKG_ZIP}" ./outfile/
          else
            echo "::error::安装包压缩包不存在: ${PKG_ZIP}"
            exit 1
          fi
          cp -rf .config ./outfile/config.txt
          cd outfile
          KERNEL_VER=${{ env.KERNEL_VER }}
          # ===== 4. 重命名 rootfs 在线升级包 =====
          ROOTFS_NAME="OneCloud_${KERNEL_VER}_openwrt-amlogic-meson8b-thunder-rootfs.tar.gz"
          for file in *rootfs.tar.gz; do
            [ -f "$file" ] || continue
            [ "$file" = "$ROOTFS_NAME" ] && continue
            mv "$file" "$ROOTFS_NAME"
          done
          for file in *rootfs.tar; do
            [ -f "$file" ] || continue
            gzip -f "$file"
            mv "${file}.gz" "$ROOTFS_NAME"
          done
          echo "=== 最终发布文件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          #信息
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 上传直刷固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
          body: |
            自用玩客云一站式直刷固件[${{ env.OWRT_brun_type }}]！
            请使用双USB公头线刷机！
            ==========🧊 基本信息 🧊==========
            💻 固件源码： ${{env.OWRT_SOURCE}}
            💝 源码Tag： ${{ env.OWRT_BRANCH }}
            🧠 内核版本： ${{ env.KERNEL_VER }}
            🔑 默认密码： password
            🌐 默认地址： DHCP（请在路由器管理页面查看设备IP）
            📦 全量IPK： 全部 kmod + package 安装包压缩包（仿官方kmods目录命名）
            🔐 离线源索引： 压缩包内 Packages/Packages.gz（opkg，已尽量签名）+ 官方布局索引（详见 README-PKG-REPO.txt）
          artifacts: ${{ env.FIRMWARE }}/*

      - name: 清理Releases
        uses: rmoyulong/delete-older-releases@master
        with:
          keep_latest: 10
          delete_tags: true

      - name: 清理Workflows
        uses: rmoyulong/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
