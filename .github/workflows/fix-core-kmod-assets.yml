name: 修复 Core_Kmod 包内启用脚本与说明(一次性)

# 用途：把已发布 Release 里 Core_Kmod-*.zip 内部的 enable-local-repo.sh 与 README
# 替换为当前工作流生成的最新版本（此前几个 Release 是在修复提交之前触发的构建，
# 包内脚本缺少 /etc/apk/repositories 为目录时的兼容分支）。
# 只替换这两个文本文件，包体与索引不动；跑完即可删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: 下载-替换-回传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          mkdir -p "$work/apk" "$work/ipk" "$work/dl"

          echo '' | base64 -d > "$work/apk/enable-local-repo.sh"
          echo '' | base64 -d > "$work/apk/README-APK-REPO.txt"
          echo '' | base64 -d > "$work/ipk/enable-local-repo.sh"
          echo '' | base64 -d > "$work/ipk/README-PKG-REPO.txt"
          chmod +x "$work/apk/enable-local-repo.sh" "$work/ipk/enable-local-repo.sh"
          wc -l "$work/apk/"* "$work/ipk/"*

          fix() {
            local tag="$1" name="$2" kind="$3"
            echo "===== $tag / $name"
            gh release download "$tag" -p "$name" -D "$work/dl" --clobber --repo "$GITHUB_REPOSITORY"
            ( cd "$work/$kind" && zip -q -X "$work/dl/$name" ./* )
            unzip -l "$work/dl/$name" | tail -1
            dups=$(unzip -Z1 "$work/dl/$name" | sort | uniq -d | wc -l)
            [ "$dups" -eq 0 ] || { echo "::error::包内出现重复条目，已中止"; exit 1; }
            gh release upload "$tag" "$work/dl/$name" --clobber --repo "$GITHUB_REPOSITORY"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq ".assets[] | select(.name==\"$name\") | \"\(.name) \(.size) bytes\""
          }

          fix "OneCloud_immortalwrt_26.11.15_16.13.22_kernel_6.12.103" "Core_Kmod-6.12.103-2b2eca3d5f2e6776ab67cda6b307afcc.zip" apk
          fix "OneCloud_openwrt_26.11.15_16.06.39_kernel_6.12.112" "Core_Kmod-6.12.112-0876c769835d4efda9e2ebc35e959959.zip" apk
          fix "Onecloud_openwrt_26.11.15_16.24.33_kernel_6.6.144" "Core_Kmod-6.6.144-66eb2a65c9f701180495d85be9ec9462.zip" ipk
