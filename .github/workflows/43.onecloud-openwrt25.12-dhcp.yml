#========================================================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Use Releases file to packaging
# Cron: min (0 - 59) / hour (0 - 23) / day of month (1 - 31) / month (1 - 12) / day of week (0 - 6)(Sunday - Saturday)
#========================================================================================================================
name: 43.Onecloud-Openwrt25.12更新包管理器&DHCP+Core_Kmod
on:
  workflow_dispatch:
    inputs:
      REPO_VERSION:
        description: '选择源码Tag版本'
        required: true
        type: choice
        default: v25.12.6
        options:
          - v25.12.6
          - v25.12.5
          - v25.12.4
          - v25.12.3
          - v25.12.2
          - v25.12.1
          - v25.12.0
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: ${{ github.event.inputs.REPO_VERSION }}
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-immortalwrt25.12.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  #DIY_P3_SH: Scripts/false
  #DIY_P4_SH: Scripts/openclash32.sh
  #DIY_P5_SH: Scripts/false
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.12
  OWRT_CFG: Config/onecloud-immortalwrt25.12.config
  TZ: Asia/Shanghai

jobs:
  Build_Burn_Firmware:
    runs-on: ubuntu-latest
    steps:
      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 检查项目
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev \
          libxml2 python3-setools libffi-dev pkg-config lib32z1-dev libpcre3 \
          libpcre3-dev libncurses-dev ncurses-dev \
          build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libncursesw5-dev libssl-dev make  
          sudo bash -c 'bash <(curl -sL https://build-scripts.openwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          #echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "OWRT_brun_type=$OWRT_brun_type" >> $GITHUB_ENV
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV

      - name: 克隆源仓库
        working-directory: /workdir
        run: |
          df -hT $PWD
          echo "==> 正在克隆Tag版本: $REPO_BRANCH"
          git clone $REPO_URL openwrt
          cd openwrt
          git checkout tags/$REPO_BRANCH
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 检查脚本
        run: |
          cd ./Scripts
          dos2unix ./*.sh
          chmod +x ./*.sh

      - name: 设置soc
        run: |
          [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
          cd openwrt
          mv $GITHUB_WORKSPACE/lede6.12/target/linux/amlogic target/linux
          chmod -Rf 755 target/linux/amlogic
          ls -l target/linux/amlogic
          echo "amlogic6.12"

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

      - name: 安装订阅源
        run: |
          cd openwrt
          #更新到最新插件
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: 修复luci软件包页面(25.12 apk JSON bug)
        working-directory: ./openwrt
        run: |
          # 强制更新luci feed到最新，修复 luci-app-package-manager 网页JSON截断bug
          ./scripts/feeds update luci
          ./scripts/feeds uninstall luci-app-package-manager 2>/dev/null || true
          ./scripts/feeds install -f luci-app-package-manager
          echo "[OK] luci-app-package-manager 已更新到最新版"

      - name: 加载自定义配置
        working-directory: ./openwrt
        run: |
          $GITHUB_WORKSPACE/$DIY_P2_SH
          #if [[ "${DIY_P3_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          #fi

      - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
        working-directory: ./openwrt
        run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*

          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  ] && mv $GITHUB_WORKSPACE/${{ env.OWRT_CFG }}  .config
          #如果files文件夹不存在，创建文件夹
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files
          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi
          #web控制台去掉443监听补丁
          #if [[ "${{ env.OWRT_brun_type }}" == *"OneCloud-docker"* ]]; then
          #  cp -rf $GITHUB_WORKSPACE/ax6/uhttpd ./files/etc/config
          #else
          #去掉多余的dhcp文件，让首次启动有dhcp服务
          #  rm -rf ./files/etc/config/dhcp
          #fi
          #去掉多余的dhcp文件，让首次启动有dhcp服务
          rm -rf ./files/etc/config/dhcp

          
          #openclash 32
          #$GITHUB_WORKSPACE/$DIY_P4_SH
          #python3.patch.sh
          #if [[ "${DIY_P5_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P5_SH}
          #fi

      - name: 系统初始化：禁用签名校验 + 网络/DHCP + 扩容 + APK架构
        working-directory: ./openwrt
        run: |
          # ==========================================
          # 1. 禁用第三方软件包签名校验（apk wrapper）
          # ==========================================
          mkdir -p package/base-files/files/usr/bin
          cat > package/base-files/files/usr/bin/apk-wrapper << 'WRAPPER'
          #!/bin/sh
          exec /usr/bin/apk.real --allow-untrusted "$@"
          WRAPPER
          chmod 755 package/base-files/files/usr/bin/apk-wrapper
          mkdir -p package/base-files/files/etc/init.d
          cat > package/base-files/files/etc/init.d/S01apk-wrapper << 'INIT'
          #!/bin/sh /etc/rc.common
          START=01
          start() {
              if [ -x /usr/bin/apk ] && [ ! -L /usr/bin/apk ]; then
                  mv /usr/bin/apk /usr/bin/apk.real
                  ln -sf /usr/bin/apk-wrapper /usr/bin/apk
              fi
          }
          INIT
          chmod 755 package/base-files/files/etc/init.d/S01apk-wrapper
          mkdir -p ./files/usr/bin
          cat > ./files/usr/bin/apk-wrapper << 'WRAPPER2'
          #!/bin/sh
          exec /usr/bin/apk.real --allow-untrusted "$@"
          WRAPPER2
          chmod 755 ./files/usr/bin/apk-wrapper
          mkdir -p ./files/etc/init.d
          cat > ./files/etc/init.d/S01apk-wrapper << 'INIT2'
          #!/bin/sh /etc/rc.common
          START=01
          start() {
              if [ -x /usr/bin/apk ] && [ ! -L /usr/bin/apk ]; then
                  mv /usr/bin/apk /usr/bin/apk.real
                  ln -sf /usr/bin/apk-wrapper /usr/bin/apk
              fi
          }
          INIT2
          chmod 755 ./files/etc/init.d/S01apk-wrapper
          echo "已成功禁用第三方软件包签名校验（双保险）"

          # ==========================================
          # 2. 预置默认网络配置 (DHCP + IPv6 + eth0桥接)
          # ==========================================
          mkdir -p ./files/etc/config
          cat > ./files/etc/config/network << 'EOF'
          config interface 'loopback'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'
          	option device 'lo'
          config globals 'globals'
          	option packet_steering '1'
          config interface 'lan'
          	option proto 'dhcp'
          	option device 'br-lan'
          	option sendclientid 'auto'
          	option multipath 'off'
          config device
          	option name 'br-lan'
          	option type 'bridge'
          	list ports 'eth0'
          config interface 'lan6'
          	option proto 'dhcpv6'
          	option device 'br-lan'
          	option reqaddress 'try'
          	option reqprefix 'auto'
          	option norelease '1'
          	option sendclientid 'auto'
          	option multipath 'off'
          EOF
          echo "已预置 DHCP + IPv6 网络配置"

          # ==========================================
          # 3. 还原纯净 rc.local (双保险机制)
          # ==========================================
          rm -f ./files/etc/rc.local ./files/etc/1.sh
          mkdir -p package/base-files/files/etc
          cat > package/base-files/files/etc/rc.local << 'RCLOCAL'
          #!/bin/sh /etc/rc.common
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          exit 0
          RCLOCAL
          chmod 755 package/base-files/files/etc/rc.local
          mkdir -p ./files/etc
          cat > ./files/etc/rc.local << 'RCLOCAL2'
          #!/bin/sh /etc/rc.common
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          exit 0
          RCLOCAL2
          chmod 755 ./files/etc/rc.local
          echo "已还原纯净 rc.local"

          # ==========================================
          # 4. 首次启动自动扩容根目录 (针对玩客云 eMMC)
          # ==========================================
          mkdir -p ./files/etc/uci-defaults
          cat > ./files/etc/uci-defaults/99-resize-rootfs << 'RESIZE'
          #!/bin/sh
          resize2fs /dev/mmcblk1p2
          exit 0
          RESIZE
          chmod 755 ./files/etc/uci-defaults/99-resize-rootfs
          echo "已配置首次开机自动扩容（uci-defaults 机制，执行后自删）"

          # ==========================================
          # 5. 追加 APK 兼容架构 (arm_cortex-a5_vfpv4)
          # ==========================================
          mkdir -p ./files/etc/uci-defaults
          cat > ./files/etc/uci-defaults/99-apk-arch << 'APKARCH'
          #!/bin/sh
          # 保留原始 arm_cortex-a5_neon-vfpv4，仅追加 arm_cortex-a5_vfpv4
          ARCH_FILE=/etc/apk/arch
          [ -f "$ARCH_FILE" ] || touch "$ARCH_FILE"
          grep -qx 'arm_cortex-a5_vfpv4' "$ARCH_FILE" || echo 'arm_cortex-a5_vfpv4' >> "$ARCH_FILE"
          exit 0
          APKARCH
          chmod 755 ./files/etc/uci-defaults/99-apk-arch
          echo "已配置首次开机追加 APK 架构 arm_cortex-a5_vfpv4（保留原始架构）"

          # ==========================================
          # 6. 首次启动完成后自动重启一次
          # ==========================================
          mkdir -p ./files/etc/uci-defaults
          cat > ./files/etc/uci-defaults/99-zz-firstboot-reboot << 'REBOOT'
          #!/bin/sh
          # 首次启动完成后自动重启一次
          [ -f /tmp/firstboot-reboot-done ] && exit 0
          touch /tmp/firstboot-reboot-done
          ( sleep 60 && reboot ) &
          exit 0
          REBOOT
          chmod 755 ./files/etc/uci-defaults/99-zz-firstboot-reboot
          echo "已配置首次启动完成后自动重启（uci-defaults 机制，执行后自删）"

      - name: 下载编译环境
        working-directory: ./openwrt
        run: |
          # 确保生成 rootfs.tar.gz 在线升级包
          if grep -q "CONFIG_TARGET_ROOTFS_TARGZ" .config; then
            sed -i 's/^CONFIG_TARGET_ROOTFS_TARGZ.*/CONFIG_TARGET_ROOTFS_TARGZ=y/' .config
          else
            echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
          fi
          # 仿官方发行版：编译对应源码发行版的全部 kmod 包 + 全部 package 包（生成 apk 安装包）
          if grep -q "CONFIG_ALL_KMODS" .config; then
            sed -i 's/^CONFIG_ALL_KMODS.*/CONFIG_ALL_KMODS=y/' .config
          else
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          if grep -q "CONFIG_ALL_PACKAGES" .config; then
            sed -i 's/^CONFIG_ALL_PACKAGES.*/CONFIG_ALL_PACKAGES=y/' .config
          else
            echo "CONFIG_ALL_PACKAGES=y" >> .config
          fi
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

      - name: 预生成内核配置(防kconfig交互卡死)
        working-directory: ./openwrt
        run: |
          # ALL_KMODS 会启用 RC/Media/DVB 等大量内核子系统，而板级 config-6.12
          # 缺少部分新内核符号（如 BPF_LIRC_MODE2）。OpenWrt 在 Kernel/Configure
          # 合并生成内核 .config 后立即开始编译，kbuild syncconfig 会对缺失符号
          # 弹出交互式提问，在 CI 非交互环境中直接报错退出。
          # 这里给克隆源码树的 include/kernel-defaults.mk 打补丁：在开始编译
          # 内核模块前先执行一次 olddefconfig，把所有缺失符号用默认值静默补全，
          # 使后续内核编译完全非交互（只改克隆源码，不改本仓库任何文件）。
          python3 - <<'PYEOF'
          p = "include/kernel-defaults.mk"
          s = open(p).read()
          old = "define Kernel/CompileModules/Default\n\trm -f $(LINUX_DIR)/vmlinux $(LINUX_DIR)/System.map\n"
          new = "define Kernel/CompileModules/Default\n\t$(_SINGLE)$(KERNEL_MAKE) olddefconfig\n\trm -f $(LINUX_DIR)/vmlinux $(LINUX_DIR)/System.map\n"
          assert old in s, "kernel-defaults.mk 未找到目标代码，源码结构可能已变化"
          open(p, "w").write(s.replace(old, new, 1))
          print("[OK] 已在 Kernel/CompileModules 前注入 olddefconfig")
          PYEOF
          grep -n "olddefconfig" include/kernel-defaults.mk

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: 获取内核版本
        working-directory: ./openwrt
        run: |
          KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
          if [ -n "$KERNEL_PKG" ]; then
            KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
          else
            KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
          fi
          if [ -z "$KERNEL_VER" ]; then
            KERNEL_VER="unknown"
          fi
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "获取到的内核版本为: $KERNEL_VER"

      - name: 打包Core+Kmod安装包(产出 Core_Kmod-<内核版本>-<哈希>.zip)
        working-directory: ./openwrt
        run: |
          # ==========================================================
          # 按官方 Supplementary Files 的板级布局，只归档两个目录：
          #   repo/targets/<board>/<sub>/packages/                    ← core 源（板级基础包）
          #   repo/targets/<board>/<sub>/kmods/<内核版本>-1-<哈希>/     ← kmods 源（内核模块）
          # base/luci/packages/routing/telephony 等应用源【不打进包】，
          # 设备端继续使用官方源/第三方源，避免同名包互相覆盖。
          # apk(v3) 的索引为 packages.adb（签名内嵌，无独立 .sig），
          # 必须与 apk 放在同一目录，apk 按 <索引目录>/<包名>-<版本>.apk 取包。
          # ==========================================================
          # 1. 压缩包命名：Core_Kmod-<三段内核版本>-<哈希>.zip
          #    哈希优先取 kmods 目录名末尾的 vermagic（与 kernel 依赖串一致）；
          #    目录缺失时从 kernel-<ver>~<vermagic>-r1.apk 文件名提取；
          #    仍取不到则兜底用源码 commit 前 32 位
          KVER3="${KERNEL_VER:-}"
          KMOD_HASH=""
          KMOD_DIR=$(find bin -type d -path "*kmods/*" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            KMOD_BASE=$(basename "$KMOD_DIR")
            KMOD_HASH="${KMOD_BASE##*-}"
            [ -n "$KVER3" ] || KVER3="${KMOD_BASE%%-*}"
          fi
          if [ -z "$KMOD_HASH" ] || [ -z "$KVER3" ]; then
            KPKG=$(ls bin/targets/*/*/packages/kernel-*.apk bin/targets/*/*/packages/kernel_*.ipk 2>/dev/null | head -n 1)
            if [ -n "$KPKG" ] && [ -f "$KPKG" ]; then
              KB=$(basename "$KPKG")
              if [ -z "$KVER3" ]; then
                KVER3=$(printf '%s' "$KB" | sed -nE 's/^kernel[-_]([0-9]+\.[0-9]+\.[0-9]+)[~-].*$/\1/p')
              fi
              if [ -z "$KMOD_HASH" ]; then
                KMOD_HASH=$(printf '%s' "$KB" | sed -nE 's/^kernel[-_][0-9.]+~([0-9a-f]{8,})[-.].*$/\1/p')
              fi
            fi
          fi
          # 校验哈希为十六进制，否则回退
          case "$KMOD_HASH" in
            ""|*[!0-9a-f]*) KMOD_HASH=$(git rev-parse HEAD 2>/dev/null | cut -c1-32 || true) ;;
          esac
          # 二次校验：无 git 提交时 rev-parse 会输出 "HEAD"，此时用占位值
          case "$KMOD_HASH" in
            ""|*[!0-9a-f]*) KMOD_HASH="unknown" ;;
          esac
          [ -n "$KVER3" ] || KVER3="unknown"
          ZIP_NAME="Core_Kmod-${KVER3}-${KMOD_HASH}.zip"
          echo "安装包压缩包名: $ZIP_NAME"

          # 1.5 把 firmware 包补进 core：先落盘到 bin 源目录，第 2 步统一收集
          #     firmware 属 feeds/base（架构包），不由 bin/targets/<b>/<s>/packages 产出；
          #     而 kmod 的元数据里对它们是硬依赖（如 kmod-rtl8822ce -> rtl8822ce-firmware），
          #     apk 依赖校验很严，缺固件会直接拒绝安装，所以随 core 一起归档。
          #     跳过 kmod-*firmware*（属内核模块，已在 kmods 目录，避免重复收录）。
          CORE_DIR=$(find bin/targets/*/*/packages -maxdepth 0 -type d 2>/dev/null | head -n 1 || true)
          if [ -n "$CORE_DIR" ]; then
            FW_ADDED=0
            while IFS= read -r f; do
              b=$(basename "$f")
              case "$b" in
                kmod-*firmware*) continue ;;
              esac
              if [ -e "$CORE_DIR/$b" ]; then
                continue
              fi
              if cp -f "$f" "$CORE_DIR/"; then
                FW_ADDED=$((FW_ADDED + 1))
                echo "  + firmware: $b"
              else
                echo "::warning::firmware 拷贝失败: $b"
              fi
            done < <(find bin/packages/*/base -maxdepth 1 -type f -name '*firmware*.apk' 2>/dev/null)
            echo "已补入 core 的 firmware 包: $FW_ADDED 个（kmod 硬依赖的固件）"
          fi

          # 2. 只归档板级两目录（不收 bin/packages/<arch> 下的应用源包）
          #    唯一例外见上一步：kmod 硬依赖的 firmware 包已补进 core
          STAGE=/workdir/apk_stage
          REPO="$STAGE/repo"
          rm -rf "$STAGE"
          mkdir -p "$REPO"
          COUNT=0
          for sub in packages kmods; do
            while IFS= read -r f; do
              rel=${f#bin/}
              mkdir -p "$REPO/$(dirname "$rel")"
              cp -n "$f" "$REPO/$rel" 2>/dev/null || true
              COUNT=$((COUNT + 1))
            done < <(find bin/targets/*/*/"$sub" -type f -name "*.apk" 2>/dev/null)
          done
          [ "$COUNT" -gt 0 ] || { echo "::error::未找到板级 apk 包（bin/targets/*/*/packages、*/kmods）"; exit 1; }
          echo "共收集 $COUNT 个 apk（板级 packages + kmods）"
          echo "=== 目录分布 ==="
          find "$REPO" -type f -name "*.apk" -printf '%h\n' | sed "s|^$REPO/||" | sort | uniq -c

          # 3. 定位 apk 工具与构建密钥（rules.mk: BUILD_KEY_APK_SEC/PUB）
          TOPDIR=$(pwd)
          APK_BIN=""
          for c in staging_dir/host/bin/apk "$(command -v apk 2>/dev/null || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then APK_BIN=$(readlink -f "$c"); break; fi
          done
          [ -n "$APK_BIN" ] || { echo "::error::未找到 apk 工具（staging_dir/host/bin/apk）"; exit 1; }
          echo "apk 工具: $APK_BIN"
          OPENSSL=$(command -v openssl 2>/dev/null || echo staging_dir/host/bin/openssl)
          if [ ! -s private-key.pem ]; then
            "$OPENSSL" ecparam -name prime256v1 -genkey -noout -out private-key.pem
          fi
          if [ ! -s public-key.pem ]; then
            "$OPENSSL" ec -in private-key.pem -pubout -out public-key.pem 2>/dev/null
          fi

          # 4. 逐个补签 apk（编译未启用 SIGNED_PACKAGES 时包本身无签名，
          #    只签索引设备端安装仍报 UNTRUSTED；adbsign 一次传多文件只签第一个，必须逐文件）
          echo "=== 给 $COUNT 个 apk 补签 ==="
          export APK_BIN TOPDIR
          find "$REPO" -type f -name '*.apk' -print0 \
            | xargs -0 -n 1 -P "$(nproc)" sh -c '"$APK_BIN" adbsign --allow-untrusted --sign "$TOPDIR/private-key.pem" "$1" >/dev/null 2>&1 || true' _
          SAMPLE_N=5
          [ "$COUNT" -lt "$SAMPLE_N" ] && SAMPLE_N=$COUNT
          SAMPLE_OK=0
          for f in $(find "$REPO" -type f -name '*.apk' | shuf -n "$SAMPLE_N"); do
            if "$APK_BIN" verify --keys-dir "$TOPDIR" "$f" >/dev/null 2>&1; then
              SAMPLE_OK=$((SAMPLE_OK + 1))
            fi
          done
          echo "[OK] 补签完成，抽样校验通过 ${SAMPLE_OK}/${SAMPLE_N}"
          if [ "$SAMPLE_OK" -lt "$SAMPLE_N" ]; then
            echo "::warning::部分 apk 补签未生效，设备端安装时可能需加 --allow-untrusted"
          fi

          # 5. 逐目录生成 packages.adb（索引与包同目录，签名内嵌）
          IDX_DIRS=0
          IDX_PKGS=0
          while IFS= read -r d; do
            N=$(find "$d" -maxdepth 1 -type f -name '*.apk' | wc -l)
            [ "$N" -gt 0 ] || continue
            if ! ( cd "$d" && "$APK_BIN" mkndx --root "$TOPDIR" --keys-dir "$TOPDIR" \
                     --allow-untrusted --sign "$TOPDIR/private-key.pem" \
                     --output packages.adb ./*.apk ); then
              echo "::error::索引生成失败: ${d#$REPO/}"
              exit 1
            fi
            if ! "$APK_BIN" adbdump "$d/packages.adb" >/dev/null 2>&1; then
              echo "::error::索引回读校验失败: ${d#$REPO/}"
              exit 1
            fi
            IDX_DIRS=$((IDX_DIRS + 1))
            IDX_PKGS=$((IDX_PKGS + N))
            echo "  [OK] ${d#$REPO/} -> packages.adb (${N} 个包)"
          done < <(find "$REPO" -type d | sort)
          [ "$IDX_DIRS" -gt 0 ] || { echo "::error::未生成任何 packages.adb"; exit 1; }
          echo "[OK] 已为 ${IDX_DIRS} 个目录生成索引，索引共收录 ${IDX_PKGS} 个包"

          # 6. 公钥 + 一键启用脚本（只会添加上面两个目录对应的源）
          cp -f public-key.pem "$STAGE/public-key.pem"

          cat > "$STAGE/enable-local-repo.sh" <<'EOS'
          #!/bin/sh
          # 在路由器上执行： sh ./enable-local-repo.sh
          # 只添加本地 core 与 kmods 两条源；base/luci 等继续走官方源，无需改动
          set -e
          BASE=$(cd "$(dirname "$0")" && pwd)
          if [ -f "$BASE/public-key.pem" ]; then
            mkdir -p /etc/apk/keys
            cp -f "$BASE/public-key.pem" /etc/apk/keys/
            echo "已导入公钥: /etc/apk/keys/public-key.pem"
          fi
          CONF=/etc/apk/repositories
          N=0
          for P in $(cd "$BASE" && find repo -name packages.adb -type f 2>/dev/null); do
            LINE="ndx file://$BASE/$P"
            grep -qF "$LINE" "$CONF" 2>/dev/null && continue
            N=$((N + 1))
            echo "$LINE" >> "$CONF"
          done
          echo "已添加 $N 条本地源到 $CONF"
          apk update
          EOS
          chmod +x "$STAGE/enable-local-repo.sh"

          cat > "$STAGE/README-APK-REPO.txt" <<'EOF'
          25.12 本地软件源（只含 core 板级包 + kmods 内核模块，共两个目录）
          ================================================================
          压缩包命名：Core_Kmod-<三段内核版本>-<哈希>.zip
          （哈希为内核 vermagic，与 apk info kernel 或 /etc/apk/arch 对应的内核串一致）
          本包与官方 Supplementary Files 中的 packages/、kmods/ 两个目录一一对应：
            repo/targets/<board>/<sub>/packages/                        ← core 源
            repo/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>/    ← kmods 源

          base / luci / packages / routing / telephony 等应用源【不在本包内】，
          请继续使用官方源或第三方源（原 /etc/apk/repositories 保持不动），
          这样本地源与官方源没有同名包，不会互相覆盖。

          【一键启用】解压到路由器或挂载目录后执行：
              sh /mnt/usb/repo/enable-local-repo.sh
              apk update

          【手动】在 /etc/apk/repositories 中加两条（ndx 指向索引文件本身）：
              ndx file:///mnt/usb/repo/repo/targets/<board>/<sub>/packages/packages.adb
              ndx file:///mnt/usb/repo/repo/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>/packages.adb

          【局域网 HTTP 方式】把 repo/ 下的目录结构放到 Web 服务器根，例如：
              ndx http://192.168.5.1/onecloud/immortalwrt/25.12/targets/<board>/<sub>/packages/packages.adb
              ndx http://192.168.5.1/onecloud/immortalwrt/25.12/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>/packages.adb

          注意：
          1) kmod 必须与本机内核完全一致（apk info kernel 或 uname -r 核对），
             内核不同时本地 kmods 源会因 kernel 依赖不满足而装不上；
          2) 不要安装 kernel 包（会覆盖运行中的内核）；
          3) packages.adb 已用 public-key.pem 对应私钥签名，把 public-key.pem 放进
             /etc/apk/keys/ 即可；若提示签名不可信，可临时加 --allow-untrusted。
          EOF

          # 7. 压缩打包（apk 本身已压缩，使用存储模式加快速度）
          rm -f "/workdir/${ZIP_NAME}"
          (cd "$STAGE" && zip -q -0 -r "/workdir/${ZIP_NAME}" ./*)
          du -sh "/workdir/${ZIP_NAME}"
          # GitHub Release 单文件上限 2GiB，超限则提前报错
          ZIP_BYTES=$(stat -c%s "/workdir/${ZIP_NAME}")
          if [ "$ZIP_BYTES" -gt 2147483647 ]; then
            echo "::error::安装包压缩包超过 2GiB 上限，无法上传 Release"
            exit 1
          fi
          echo "APK_ZIP=/workdir/${ZIP_NAME}" >> $GITHUB_ENV

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 备份原生rootfs升级包(防止打包脚本清理)
        working-directory: ./openwrt
        run: |
          mkdir -p /workdir/rootfs_backup
          # 兼容 rootfs.tar.gz 与 rootfs.tar 两种产物
          find bin/targets/ -type f -name "*rootfs.tar.gz" -exec cp -f {} /workdir/rootfs_backup/ \;
          find bin/targets/ -type f -name "*rootfs.tar"   -exec cp -f {} /workdir/rootfs_backup/ \;
          echo "=== 已备份的 rootfs 包 ==="
          ls -lh /workdir/rootfs_backup/

      - name: 制作直刷包
        # 注意：这里不要再写 "|| true"。
        # convert2.sh 内部已做“去回读校验 + 成品自检”，一旦自检不通过就必须让
        # 整个 job 失败，否则会把烧录时必报“校验错误”的坏包上传到 Release。
        env:
          KEEP_VERIFY: '0'          # 0=去掉烧录后 SHA1 回读校验（解决“校验错误”）
          DROP_VERIFY_ITEMS: '1'    # 1=同时丢弃容器里的 VERIFY 项
          BOOT_SIZE_MB: '2000'      # boot 分区镜像大小，与原脚本保持一致
        run: |
          chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
          dos2unix $GITHUB_WORKSPACE/Scripts/convert2.sh
          $GITHUB_WORKSPACE/Scripts/convert2.sh

      - name: 校验直刷包结构(防空包/防回退)
        run: |
          cd openwrt
          xzfile=$(find bin/targets -type f -name "*burn.img.xz" | head -n 1)
          [ -n "$xzfile" ] || { echo "::error::没有生成 burn.img.xz"; exit 1; }
          echo "成品: $xzfile"
          ls -lh "$xzfile" "$xzfile".sha 2>/dev/null || true
          # 解压后回读容器，确认里面没有 [LIST_VERIFY] / VERIFY 项
          cp -f "$xzfile" /tmp/verify.burn.img.xz
          unxz -f /tmp/verify.burn.img.xz
          $GITHUB_WORKSPACE/Scripts/convert2.sh check /tmp/verify.burn.img
          rm -f /tmp/verify.burn.img

      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          mkdir -p outfile
          # 1. 先精确找到真正的直刷包和校验文件（忽略任何已经带前缀的，防止死循环）
          BURN_NAME="OneCloud_${KERNEL_VER}_openwrt-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"

          # 查找原始的 xz 包
          for file in $(find bin/targets/ -type f -name "*burn.img.xz" ! -name "OneCloud_*"); do
            if [ -f "$file" ]; then
              BASE_NAME=$(basename "$file")
              cp -f "$file" "./outfile/$BURN_NAME"

              # 查找与之对应的 sha 包
              SHA_FILE="${file%.xz}.sha"
              if [ -f "$SHA_FILE" ]; then
                NEW_SHA_NAME="${BURN_NAME}.sha"
                cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
                # 替换 sha 文件内部记录的旧文件名
                sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
              fi
            fi
          done
          # 2. 清理可能存在的其他无用 sha，防止被一起上传
          rm -f ./outfile/immortalwrt-*.sha
          # 3. 复制打包前备份的 rootfs 升级包
          cp -rf /workdir/rootfs_backup/* ./outfile/ 2>/dev/null || true
          # 4. 复制全部APK安装包压缩包（随 Release 一并上传）
          if [ -n "${APK_ZIP}" ] && [ -f "${APK_ZIP}" ]; then
            cp -f "${APK_ZIP}" ./outfile/
          else
            echo "::error::APK压缩包不存在: ${APK_ZIP}"
            exit 1
          fi
          cp -rf .config ./outfile/config.txt
          cd outfile
          KERNEL_VER=${{ env.KERNEL_VER }}
          # ===== 4. 重命名 rootfs 在线升级包 =====
          ROOTFS_NAME="OneCloud_${KERNEL_VER}_openwrt-amlogic-meson8b-thunder-rootfs.tar.gz"
          for file in *rootfs.tar.gz; do
            [ -f "$file" ] || continue
            [ "$file" = "$ROOTFS_NAME" ] && continue
            mv "$file" "$ROOTFS_NAME"
          done
          for file in *rootfs.tar; do
            [ -f "$file" ] || continue
            gzip -f "$file"
            mv "${file}.gz" "$ROOTFS_NAME"
          done
          echo "=== 最终发布文件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          #信息
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 上传直刷固件
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: OneCloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
          body: |
            自用玩客云一站式直刷固件[${{ env.OWRT_brun_type }}]！
            请使用双USB公头线刷机！
            ==========🧊 基本信息 🧊==========
            💻 固件源码： ${{env.OWRT_SOURCE}}
            💝 源码Tag： ${{ env.OWRT_BRANCH }}
            🧠 内核版本： ${{ env.KERNEL_VER }}
            🔑 默认密码： password
            🌐 默认地址： DHCP（请在路由器管理页面查看设备IP）
            📦 Core+Kmod： core 板级包 + 全部 kmod 内核模块（两个目录，沿用官方 packages/kmods 布局）
            🔐 APK离线源： 两个目录各带已签名 packages.adb + public-key.pem，解压即用（详见 README-APK-REPO.txt）
          artifacts: ${{ env.FIRMWARE }}/*

      - name: 清理Releases
        uses: rmoyulong/delete-older-releases@master
        with:
          keep_latest: 10
          delete_tags: true

      - name: 清理Workflows
        uses: rmoyulong/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
