
#云编译公用核心
name: 0.onecloud-core-mini

on:
  #公用核心标识
  workflow_call:
    inputs:
      OWRT_TARGET:
        required: true
        type: string
      OWRT_THEME:
        required: true
        type: string
      OWRT_NAME:
        required: true
        type: string
      OWRT_URL:
        required: true
        type: string
      OWRT_PW:
        required: true
        type: string
      OWRT_IP:
        required: true
        type: string
      OWRT_CFG:
        required: true
        type: string
      OWRT_BRANCH:
        required: true
        type: string
      OWRT_TYPE:
        required: true
        type: string
      OWRT_LINUX:
        required: true
        type: string
      OWRT_FILES:
        required: true
        type: string
      DIY_P1_SH:
        required: true
        type: string
      DIY_P2_SH:
        required: true
        type: string
      OWRT_DOCKER:
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  OWRT_TARGET: ${{inputs.OWRT_TARGET}}
  OWRT_THEME: ${{inputs.OWRT_THEME}}
  OWRT_NAME: ${{inputs.OWRT_NAME}}
  OWRT_URL: ${{inputs.OWRT_URL}}
  OWRT_PW: ${{inputs.OWRT_PW}}
  OWRT_IP: ${{inputs.OWRT_IP}}
  OWRT_CFG: ${{inputs.OWRT_CFG}}
  OWRT_BRANCH: ${{inputs.OWRT_BRANCH}}
  OWRT_TYPE: ${{inputs.OWRT_TYPE}}
  OWRT_LINUX: ${{inputs.OWRT_LINUX}}
  OWRT_FILES: ${{inputs.OWRT_FILES}}
  DIY_P1_SH: Scripts/${{inputs.DIY_P1_SH}}
  DIY_P2_SH: Scripts/${{inputs.DIY_P2_SH}}
  OWRT_DOCKER: ${{inputs.OWRT_DOCKER}}
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai

jobs:
  OneCloud-core-mini:
    runs-on: ubuntu-latest

    steps:

      - name: 清理服务器空间(Ubuntu)
        uses: rmoyulong/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 项目检查
        uses: actions/checkout@main

      - name: 最大化编译空间
        uses: rmoyulong/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          build-mount-path: /workdir
          overprovision-lvm: 'true'
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

      - name: 初始化变量
        run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo ${{inputs.OWRT_URL}} | cut -d '/' -f 5-)

          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_TARGET=$OWRT_TARGET" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_TYPE=$OWRT_TYPE" >> $GITHUB_ENV
          echo "OWRT_PW=$OWRT_PW" >> $GITHUB_ENV
          echo "OWRT_IP=$OWRT_IP" >> $GITHUB_ENV
          echo "OWRT_LINUX=$OWRT_LINUX" >> $GITHUB_ENV
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV
          echo "OWRT_DOCKER=$OWRT_DOCKER" >> $GITHUB_ENV
          echo "FEEDS_CONF=$FEEDS_CONF" >> $GITHUB_ENV

      - name: 克隆源码库
        working-directory: /workdir
        run: |
          # Set up compilation source code
          REPO_URL="${{ inputs.OWRT_URL }}"
          REPO_BRANCH="${{ inputs.OWRT_BRANCH }}"

          df -hT $PWD
          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 检查脚本
        run: |
          cd ./Scripts

          dos2unix ./*.sh
          chmod +x ./*.sh

      - name: 设置soc
        run: |
          cd openwrt

          if [ ! -f $GITHUB_WORKSPACE/ax6/$FEEDS_CONF ]; then
            echo "feeds.conf.default文件不存在！"
          else
            cp -rf $GITHUB_WORKSPACE/ax6/$FEEDS_CONF ./feeds.conf.default
          fi

          mv $GITHUB_WORKSPACE/lede6.6/target/linux/meson target/linux/meson
          chmod -Rf 755 target/linux/meson
          echo "拷贝定义的源文件！"
          ls -l target/linux/meson

          if [ ! -f target/linux/meson/Makefile ]; then
            echo "Makefile文件不存在！"
          else
            echo "Makefile文件存在！"
          fi

          export OWRT_SOURCE=$(echo ${{inputs.OWRT_URL}} | cut -d '/' -f 5-)
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV

      - name: 启动缓存[第二次起生效]
        uses: rmoyulong/cachewrtbuild@main
        with:
          ccache: 'true'
          prefix: ${{ github.workspace }}/openwrt
          mixkey: ${{ env.OWRT_SOURCE }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }}

      - name: 更新安装订阅源
        working-directory: ./openwrt
        run: |
          #更新到最新插件
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name:  加载自定义配置
        working-directory: ./openwrt
        run: |
          #通用设置和ssh登录图案
          #curl -L -o package/base-files/files/etc/banner https://raw.githubusercontent.com/rmoyulong/AX6-Actions_Lede/master/ax6/cats_banner
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
        working-directory: ./openwrt
        run: |
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*

          rm -rf ./tmp* ./.config*
          [ -e $GITHUB_WORKSPACE/Config/$OWRT_CFG ] && mv $GITHUB_WORKSPACE/Config/$OWRT_CFG .config

          #如果files文件夹不存在，创建文件夹
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files

          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi

          #去掉多余的dhcp文件，让首次启动有dhcp服务
          rm -rf ./files/etc/config/dhcp

          #设置主路由
          OWRT_SERVER_IP=${OWRT_IP%.*}.1
          $GITHUB_WORKSPACE/Scripts/edit_files.sh "${{ env.OWRT_IP }}" "$OWRT_SERVER_IP"

      - name: 下载编译依赖
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))
          find dl -size -1k -exec rm -f {} \;

      - name: 编译固件
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          # 获取实际编译的内核版本（供 Release 显示与文件命名）
          KERNEL_VERSION=$(make kernelversion 2>/dev/null)
          [ -z "$KERNEL_VERSION" ] && KERNEL_VERSION="${OWRT_LINUX}"
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "实际内核版本：$KERNEL_VERSION"

      - name: 整理固件
        id: organize
        run: |
          cd openwrt
          cp -rf .config ./bin/targets/meson/meson8b/config.txt
          cd bin/targets/meson/meson8b
          rm -rf ./packages

          if [[ $REPO_URL == *"immortalwrt"* ]]; then
            gzip *.tar
          fi

          # 给卡刷包与校验文件追加内核版本号后缀
          # 若想改用源码 tag/分支作后缀，把下行换成：SUFFIX="_${OWRT_BRANCH}"
          SUFFIX="_kernel-${KERNEL_VERSION}"
          for FILE in *.tar.gz *.img.gz *.bin *.img *.itb *.trx; do
            [ -e "$FILE" ] || continue
            case "$FILE" in
              *.tar.gz) STEM="${FILE%.tar.gz}"; EXT=".tar.gz" ;;
              *.img.gz) STEM="${FILE%.img.gz}"; EXT=".img.gz" ;;
              *)        STEM="${FILE%.*}";      EXT=".${FILE##*.}" ;;
            esac
            mv -f "$FILE" "${STEM}${SUFFIX}${EXT}"
            echo "重命名：$FILE -> ${STEM}${SUFFIX}${EXT}"
          done
          for FILE in *.sha256sums; do
            [ -e "$FILE" ] || continue
            NEW="${FILE%.sha256sums}${SUFFIX}.sha256sums"
            sed -i -E "s/([^[:space:]]+)\.tar\.gz$/\1${SUFFIX}.tar.gz/; s/([^[:space:]]+)\.img\.gz$/\1${SUFFIX}.img.gz/; s/([^[:space:]]+)\.bin$/\1${SUFFIX}.bin/" "$FILE"
            mv -f "$FILE" "$NEW"
            echo "重命名：$FILE -> $NEW"
          done

          #获得当前目录的路径信息
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "::set-output name=status::success"

          #信息
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo ${{inputs.OWRT_URL}} | cut -d '/' -f 5-)
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

      - name: 生成标记和标签
        id: generate_name
        run: |
          time=$(date +%Y%m%d%H%M%S)
          release_tag="$time"
          release_name="meson8b-$(date +%Y%m%d)"
          echo "release_name=$release_name" >> $GITHUB_OUTPUT
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          if [[ $OWRT_CFG == *"arm7_mini.config"* ]]; then
            echo "OWRT_TYPE=[正常版]" >> $GITHUB_ENV
          elif [[ $OWRT_CFG == *"arm7.config"* ]]; then
            echo "OWRT_TYPE=[全版]" >> $GITHUB_ENV
          else
            echo "OWRT_TYPE=[正常版]" >> $GITHUB_ENV
          fi

      - name: 上传IMAGES[卡刷版]
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: OpenWrt_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}
          body: |
            玩客云${{ env.OWRT_TYPE }}[meson6.6]卡刷包！
            请使用rufus写盘启动！
            ==========🧊 基本信息 🧊==========
            💻 固件源码： ${{env.OWRT_SOURCE}}
            💝 源码分支： ${{ inputs.OWRT_BRANCH }}
            🙌 内核版本： ${{ env.KERNEL_VERSION }}
            🔑 默认密码： password
            🌐 默认地址： ${{env.OWRT_IP}}
          artifacts: ${{ env.FIRMWARE }}/*

      - name: 清理Releases
        uses: rmoyulong/delete-older-releases@master
        with:
          keep_latest: 12
          delete_tags: true

      - name: 清理Workflows
        uses: rmoyulong/delete-workflow-runs@main
        with:
          retain_days: 0
          keep_minimum_runs: 1
