#========================================================================================================================
# https://github.com/ophub/amlogic-s9xxx-openwrt
# Description: Use Releases file to packaging
# Cron: min (0 - 59) / hour (0 - 23) / day of month (1 - 31) / month (1 - 12) / day of week (0 - 6)(Sunday - Saturday)
#========================================================================================================================
name: 31.onecloud-lede6.18直刷包编译DHCP+Core_Kmod

on:
  # 已去掉 IP 输入项：IPv4/IPv6 全部自动获取，点 Run workflow 直接编译即可
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Config/onecloud-lede6.18.config
  DIY_P1_SH: Scripts/setup.sh
  DIY_P2_SH: Scripts/Settings.sh
  #DIY_P3_SH: Scripts/false
  #DIY_P4_SH: Scripts/openclash32.sh
  #DIY_P5_SH: Scripts/false
  #DIY_P6_SH: Scripts/edit_files.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  # Scripts/Settings.sh 里有一句 sed 会用 $OWRT_IP 替换 config_generate 的默认地址，
  # 变量为空会写出 ipaddr=''，所以这里固定给一个值。它只影响出厂兜底配置，
  # 真正生效的是下面 files/etc/config/network 里的 DHCP/DHCPv6。
  OWRT_IP: '192.168.8.59'
  OWRT_NAME: OneCloud
  OWRT_FILES: onecloud/files
  OWRT_brun_type: amlogic6.18
  TZ: Asia/Shanghai

jobs:
  Build_burn_firmware:
    runs-on: ubuntu-24.04

    steps:
    - name: 清理服务器空间(Ubuntu)
      uses: rmoyulong/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 检查项目
      uses: actions/checkout@main

    - name: 检查分配的服务器性能
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          # Ubuntu 24.04+ 已移除 libpcre3 / libxml2 / libncurses5-dev 等历史包名，
          # 批量安装会因个别包不可用而整体失败（apt exit 100），故做逐个容错安装。
          sudo -E apt -yqq install dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev || {
            echo "::warning::批量安装部分依赖不可用，改为逐个安装并跳过"
            for p in dos2unix libfuse-dev libxml2 python3-setools python3-setuptools libffi-dev pkg-config lib32z1-dev libpcre3 libpcre3-dev; do
              sudo -E apt -yqq install "$p" >/dev/null 2>&1 || echo "::notice::跳过不可用依赖: $p"
            done
          }
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          echo "status=success" >> ${GITHUB_OUTPUT}
          df -Th

    - name: 初始化变量
      run: |
          export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
          
          echo "OWRT_URL=$REPO_URL" >> $GITHUB_ENV
          echo "OWRT_BRANCH=$REPO_BRANCH" >> $GITHUB_ENV
          echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV
          echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
          echo "OWRT_TYPE=$OWRT_TYPE" >> $GITHUB_ENV
          echo "OWRT_NAME=$OWRT_NAME" >> $GITHUB_ENV
          echo "DIY_P1_SH=$DIY_P1_SH" >> $GITHUB_ENV
          echo "DIY_P2_SH=$DIY_P2_SH" >> $GITHUB_ENV
          #echo "DIY_P3_SH=$DIY_P3_SH" >> $GITHUB_ENV          
          echo "OWRT_FILES=$OWRT_FILES" >> $GITHUB_ENV
          
          echo "OWRT_brun_type=$OWRT_brun_type" >> $GITHUB_ENV
          echo ${{ env.OWRT_brun_type }}
          
          OWRT_CFG="Config/onecloud-lede6.18.config"            
          echo "OWRT_CFG=$OWRT_CFG" >> $GITHUB_ENV

    - name: 克隆源仓库
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        # 固定到已知可编译的提交（本 workflow 2026-11-12 编译成功时的 master 快照 80122fea）。
        # 背景：2026-11-13 凌晨上游 lede 推送的 "build: restore native macOS cross-compilation"
        # (bed88351) 重写了 tools/elfutils / tools/gnulib / tools/coreutils 等宿主工具，
        # 在 Actions 的 -j 并行编译下 elfutils 会构建失败（单线程 V=s 才能过）。
        # 后续上游修复后，把下面这行注释掉或换成新提交即可恢复跟踪 master。
        git -C openwrt checkout 80122feac964889bc69b62420cedfefaaf701eb0
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        
    - name: 检查脚本
      run: |
        cd ./Scripts
        dos2unix ./*.sh
        chmod +x ./*.sh          
        
    - name: 设置soc
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        cd openwrt 
        ls -l target/linux/amlogic
        echo "amlogic6.18"

    - name: 强力清理luci-app残留
      working-directory: ./openwrt
      run: |
        # 1. 删除所有已克隆的 luci-app 目录
        find feeds/luci/applications -name "luci-app-*" -type d -exec rm -rf {} + 2>/dev/null || true
        find package -name "luci-app-*" -type d -exec rm -rf {} + 2>/dev/null || true
        
        # 2. 删除 feeds 中的代理相关包
        rm -rf feeds/packages/net/hysteria
        rm -rf feeds/packages/net/xray-core
        rm -rf feeds/packages/net/v2ray-core
        rm -rf feeds/packages/net/v2ray-geodata
        rm -rf feeds/packages/net/sing-box
        
        # 3. 删除 ssr-plus 相关
        rm -rf feeds/luci/applications/luci-app-ssr-plus
        rm -rf package/helloworld
        
        # 4. 删除 OpenClash 相关
        rm -rf feeds/luci/applications/luci-app-openclash
        rm -rf package/luci-app-openclash
        
        # 5. 删除 amlogic 主题
        rm -rf package/luci-app-amlogic
        
        # 6. 清理 homeproxy
        rm -rf feeds/luci/applications/luci-app-homeproxy
        
        echo "✅ luci-app 清理完成"
        ls -la feeds/luci/applications/ 2>/dev/null || echo "feeds/luci/applications 目录已清空"
 
    - name: 启动缓存[第二次起生效]
      uses: rmoyulong/cachewrtbuild@main
      with:
        ccache: 'true'
        prefix: ${{ github.workspace }}/openwrt
        mixkey: ${{ env.OWRT_brun_type }}/tree/${{ env.OWRT_BRANCH }}?device=${{ env.OWRT_CFG }} 
      
  
    - name: 安装订阅源
      run: |
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV      
        
    - name:  加载自定义配置
      working-directory: ./openwrt
      run: |          
          $GITHUB_WORKSPACE/$DIY_P2_SH
         
          #if [[ "${DIY_P3_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P3_SH}
          #fi 
               
    - name: 自定义IMAGS格式 - meson8b cortex-a5+vfpv4
      working-directory: ./openwrt
      run: | 
          #dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          dos2unix $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          #chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/*.sh
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/rc.*
          chmod -Rf 755 $GITHUB_WORKSPACE/$OWRT_FILES/etc/init.d/*
          
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/etc/aria2
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/aria2
          #chmod -R 777 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/aria2/download
          #chmod -R 755 $GITHUB_WORKSPACE/$OWRT_FILES/mnt/sda1/share
          
          rm -rf ./tmp* ./.config*
          if [ -f "$GITHUB_WORKSPACE/$OWRT_CFG" ]; then
              cp -f "$GITHUB_WORKSPACE/$OWRT_CFG" .config
              echo "✅ 配置文件已成功覆盖: $OWRT_CFG"
          else
              echo "❌ 致命错误：找不到配置文件 $GITHUB_WORKSPACE/$OWRT_CFG"
              exit 1
          fi
          
          if [ ! -d "./files" ]; then
            mkdir ./files
          fi          
          cp -rf $GITHUB_WORKSPACE/$OWRT_FILES/* ./files
          
          ls -l files
          if [ ! -f files/etc/rc.local ]; then
            echo "rc.local文件不存在！"
          else
            cat files/etc/rc.local
          fi

          # =====================================================================
          # ★ 关键修改：网口改「双栈自动获取」
          #   IPv4 → lan  : proto dhcp    （从上游主路由拿 IPv4 地址）
          #   IPv6 → lan6 : proto dhcpv6  （向上游请求 IPv6 地址/前缀，由 odhcp6c 处理 RA）
          #
          # 原因：原来这里调用 Scripts/edit_files.sh，该脚本用 heredoc 写入
          #   option proto 'static' / option ipaddr ... / option gateway ...
          # 所以固件启动后永远是静态 IP。这里不再调用它，直接生成 DHCP 版 network，
          # 覆盖 onecloud/files 里自带的静态 network。
          # =====================================================================
          # $GITHUB_WORKSPACE/$DIY_P6_SH

          mkdir -p ./files/etc/config
          rm -f ./files/etc/config/network
          cat > ./files/etc/config/network <<'NET_EOF'
            config interface 'loopback'
              option device 'lo'
              option proto 'static'
              option ipaddr '127.0.0.1'
              option netmask '255.0.0.0'

            config globals 'globals'
              option packet_steering '1'

            config interface 'lan'
              option device 'br-lan'
              option proto 'dhcp'
              option hostname 'OneCloud'
              option broadcast '1'

            # IPv6：同一个网口再作为 DHCPv6 客户端（@lan 表示跟随 lan 的底层设备 br-lan）
            # reqaddress 'try'  → 尽量向上游请求 IA_NA 地址，拿不到也不阻塞启动
            # reqprefix  'auto' → 顺带请求前缀 PD；只要地址、不需要 PD 时改成 'no'
            config interface 'lan6'
              option device '@lan'
              option proto 'dhcpv6'
              option reqaddress 'try'
              option reqprefix 'auto'

            config device
              option name 'br-lan'
              option type 'bridge'
              list ports 'eth0'
          NET_EOF

          # 原写法最后是 rm -rf ./files/etc/config/dhcp，让系统首次启动自己生成
          # （那是「静态 IP + 本机当 DHCP 服务器」的用法）。改成 DHCP 客户端后
          # 必须显式关掉 lan 上的 DHCP/RA 服务，否则会和上游主路由的 DHCP 打架，
          # 两台设备同时发地址会让整个局域网随机断网。
          rm -f ./files/etc/config/dhcp
          cat > ./files/etc/config/dhcp <<'DHCP_EOF'
            config dnsmasq
              option domainneeded '1'
              option boguspriv '1'
              option filterwin2k '0'
              option localise_queries '1'
              option rebind_protection '0'
              option local '/lan/'
              option domain 'lan'
              option expandhosts '1'
              option nonegcache '0'
              option cachesize '10000'
              option authoritative '1'
              option readethers '1'
              option leasefile '/tmp/dhcp.leases'
              option resolvfile '/tmp/resolv.conf.d/resolv.conf.auto'
              option nonwildcard '0'
              option localservice '1'

            config dhcp 'lan'
              option interface 'lan'
              option ignore '1'
              option dhcpv4 'disabled'
              option dhcpv6 'disabled'
              option ra 'disabled'

            config odhcpd 'odhcpd'
              option maindhcp '0'
              option leasefile '/tmp/hosts/odhcpd'
              option leasetrigger '/usr/sbin/odhcpd-update'
              option loglevel '4'
          DHCP_EOF

          echo "===== 最终 network ====="
          cat ./files/etc/config/network
          echo "===== 最终 dhcp ====="
          cat ./files/etc/config/dhcp

          # OneCloud-docker 分支的 uhttpd 覆盖与 dhcp 删除逻辑已停用：
          # 现在 network / dhcp 均由本步骤统一生成，不要再覆盖。
          # $GITHUB_WORKSPACE/$DIY_P4_SH
          
          #if [[ "${DIY_P5_SH}" == *"false"* ]]; then
          #  echo "不需要执行此选项"
          #else
          #  ${GITHUB_WORKSPACE}/${DIY_P5_SH}
          #fi 
        
    # LEDE 的 include/target.mk 把 luci-app-ssr-plus 硬编码进 DEFAULT_PACKAGES.router，
    # 会被转成 select PACKAGE_luci-app-ssr-plus（select 优先级高于 .config 里的 is not set，
    # 写 # CONFIG_PACKAGE_luci-app-ssr-plus is not set 无效），只能从源码默认包里剔除。
    # 不剔除的后果：ssr-plus 默认选中 Xray 内核 → 连带编译 xray-core 26.x。
    #
    # ★ 2026-11-14 失败的真正根因（仅剔除 ssr-plus 不够）：
    #   setup.sh 里 feeds install -a 会把 helloworld 的 luci-app-ssr-plus 装回
    #   package/feeds/helloworld/，而它的 Makefile 定义了一个【不带父依赖】的 choice：
    #     choice "V2ray-core Selection"
    #       default PACKAGE_luci-app-ssr-plus_INCLUDE_Xray
    #       config ..._INCLUDE_Xray: select PACKAGE_xray-core
    #   只要包目录存在，哪怕 ssr-plus 本身未被选中，make defconfig 也会按 choice
    #   默认值强制 select xray-core。packages feed 的 xray-core 升到 26.11.9 后，
    #   其 cronet-go 的 #cgo LDFLAGS "-l:libcronet.a" 被 Go 安全检查拦截
    #   （invalid flag in #cgo LDFLAGS），编译必失败。
    #   所以这里必须把 feeds install 装回的 ssr-plus / xray-core 包目录一并删除，
    #   配合 Config/onecloud-lede6.18.config 里的 INCLUDE_NONE_V2RAY=y 双保险。
    - name: 修补源码：剔除 ssr-plus 默认包 + 修复 kmod-fb 依赖
      working-directory: ./openwrt
      run: |
          # 1) 从 include/target.mk 的默认包中剔除 ssr-plus，并断言剔除成功
          if grep -q "luci-app-ssr-plus" include/target.mk; then
            sed -i 's/ luci-app-ssr-plus//g' include/target.mk
          fi
          if grep -q "luci-app-ssr-plus" include/target.mk; then
            echo "::error::include/target.mk 仍含 luci-app-ssr-plus，剔除失败，终止编译"
            exit 1
          fi
          echo "✅ include/target.mk 已确认不含 luci-app-ssr-plus"

          # 2) 删除 feeds install -a 刚刚装回的代理包目录（本步骤在 feeds install 之后，
          #    此时删除才真正有效；早前步骤里的 rm 在 feeds update 之前，会被装回来）
          # 代理类剔除范围（CONFIG_ALL_KMODS 只影响 kmod；这里防的是两个连带源：
          # ① helloworld 的 ssr-plus 有不带父依赖的 V2ray choice，会强制 select
          #    xray-core（首次失败的主因）；② 上游 feed 里的坏包/代理包兜底剔除）：
          #   helloworld feed 整体（ssr-plus/naiveproxy/mihomo/shadowsocks-rust/...）
          #   packages feed：xray-core / v2ray-core / sing-box / hysteria / mihomo /
          #                  v2raya / v2ray-geodata / nikki / brook / trojan / chinadns-ng
          #   luci feed：ssr-plus / v2raya / nikki / openclash / passwall / passwall2 /
          #              homeproxy
          # 用户需要的包全部来自 packages / luci feed 的非代理部分（同名包 feed 优先级高），
          # 删除对固件 =y 配置零影响（=m 的代理包既不进固件也不进 Core_Kmod 包）。
          rm -rf package/feeds/helloworld feeds/helloworld
          rm -rf package/feeds/packages/xray-core package/feeds/packages/v2ray-core \
                 package/feeds/packages/sing-box package/feeds/packages/hysteria \
                 package/feeds/packages/mihomo package/feeds/packages/v2raya \
                 package/feeds/packages/v2ray-geodata package/feeds/packages/nikki \
                 package/feeds/packages/brook package/feeds/packages/trojan \
                 package/feeds/packages/chinadns-ng
          rm -rf feeds/packages/net/xray-core feeds/packages/net/v2ray-core \
                 feeds/packages/net/sing-box feeds/packages/net/hysteria \
                 feeds/packages/net/mihomo feeds/packages/net/v2raya \
                 feeds/packages/net/v2ray-geodata feeds/packages/net/nikki \
                 feeds/packages/net/brook feeds/packages/net/trojan \
                 feeds/packages/net/chinadns-ng
          for app in luci-app-ssr-plus luci-app-v2raya luci-app-nikki luci-app-openclash \
                     luci-app-passwall luci-app-passwall2 luci-app-homeproxy; do
            rm -rf "package/feeds/luci/$app" "feeds/luci/applications/$app"
          done
          echo "✅ 已删除 feeds install 装回的 ssr-plus / xray-core / helloworld 等代理包目录"

          # 3) 修复 lede 上游 kmod-fb 缺失的依赖声明（仅本工作流内修补，不改公用文件）
          #    根因：video.mk 里 KernelPackage/fb 的 DEPENDS 只有 @DISPLAY_SUPPORT，
          #    没声明 +kmod-backlight。在 meson8b 上内核配置未把 backlight 内置，
          #    kmod-backlight 以模块形式产出 backlight.ko，6.18 内核的 fb.ko 依赖它，
          #    而 kmod-fb 的 provides 只按 DEPENDS 声明合并依赖包 provides，
          #    打包 kmod-fb 时 gen-dependencies.sh 必然报
          #    "Package kmod-fb is missing dependencies: backlight.ko" → Error 1。
          #    上游其它目标（mesongx/x86 等）没炸，是因为它们的内核配置把
          #    CONFIG_BACKLIGHT_CLASS_DEVICE=y 内置了，fb.ko 不依赖模块版 backlight。
          #    ★ 注意：不能只给 fb 加 +kmod-backlight —— 上游 kmod-backlight 自己
          #      依赖 +kmod-fb，会形成 fb↔backlight 循环依赖，make 报
          #      "Circular kmod-fb <- kmod-backlight dependency dropped" 后顺序失效
          #      （run 44251436953 实测）。必须两处同时修：fb 补依赖 + backlight 去掉
          #      +kmod-fb 打破环，backlight 的 AUTOLOAD 顺序不受影响。
          if grep -q "^ *DEPENDS:=@DISPLAY_SUPPORT$" package/kernel/linux/modules/video.mk; then
            sed -i 's/^\( *DEPENDS:=@DISPLAY_SUPPORT\)$/\1 +kmod-backlight/' package/kernel/linux/modules/video.mk
          fi
          FB_FIX=$(grep -c "^ *DEPENDS:=@DISPLAY_SUPPORT +kmod-backlight$" package/kernel/linux/modules/video.mk)
          if [ "$FB_FIX" -lt 1 ]; then
            echo "::error::video.mk 的 kmod-fb 依赖修补失败（未匹配到 DEPENDS:=@DISPLAY_SUPPORT），终止编译"
            exit 1
          fi
          sed -i 's/^\([ \t]*DEPENDS:=@DISPLAY_SUPPORT\) +kmod-fb$/\1/' package/kernel/linux/modules/video.mk
          CYCLE=$(grep -c "^ *[ \t]*DEPENDS:=@DISPLAY_SUPPORT +kmod-fb$" package/kernel/linux/modules/video.mk)
          if [ "$CYCLE" -ne 0 ]; then
            echo "::error::video.mk 的 kmod-backlight 去除 +kmod-fb 失败（循环依赖未打破），终止编译"
            exit 1
          fi
          echo "✅ kmod-fb 已补上 +kmod-backlight 依赖（$FB_FIX 处），kmod-backlight 的 +kmod-fb 已移除（循环依赖已打破）"

          grep -n "DEFAULT_PACKAGES.router" include/target.mk

    - name: 下载编译环境
      working-directory: ./openwrt
      run: |      
          # ========== 补齐 IPv6 客户端组件 ==========
          # Config/onecloud-lede6.18.config 里没有显式打开 odhcp6c（DHCPv6 客户端）
          # 和 luci-proto-ipv6（LuCI 里能选到 DHCPv6 协议）。缺 odhcp6c 时，
          # lan6 的 proto dhcpv6 根本起不来（/sbin/odhcp6c 不存在），IPv6 拿不到地址。
          for sym in CONFIG_PACKAGE_odhcp6c CONFIG_PACKAGE_luci-proto-ipv6 CONFIG_PACKAGE_kmod-ipv6; do
            grep -q "^${sym}=y" .config || echo "${sym}=y" >> .config
          done

          # ========== 全量 kmod 编译开关（仿 12/51 号，为 Core_Kmod 安装包服务） ==========
          # 只开 CONFIG_ALL_KMODS，不再开 CONFIG_ALL。原因（上次全量 run 的实测结论）：
          #   1) Core_Kmod zip 只归档 bin/targets/<board>/<sub>/packages + kmods 两目录，
          #      而那里只会出现 kmod-* / kernel / libc 等板级包（实测 844 个）；
          #      CONFIG_ALL 拉起的 ~9400 个 feed 应用 =m 包全部落在 bin/packages/<arch>，
          #      根本进不了 zip —— 纯属多花两三个小时编译。
          #   2) CONFIG_ALL 会把上游坏包也拉起来连坐整个编译：
          #      pgyvpn（上游下载源 404）、golang（Settings.sh 换成 sbwml 最新版后
          #      target 包在本目标编译失败）等。去掉 CONFIG_ALL 后它们根本不被选中。
          #   3) kmod 全量覆盖由 CONFIG_ALL_KMODS 独立保证（实测 1005 个 kmod=m），
          #      与 CONFIG_ALL 无关；固件 =y 本体（474 个）完全不受影响。
          #   注：lede 的符号名是 CONFIG_ALL_KMODS；24.10 的 CONFIG_ALL_PACKAGES 在
          #   lede 里不存在，写了会被 defconfig 静默丢弃，千万不要用。
          for sym in CONFIG_ALL_KMODS; do
            if grep -q "^${sym}=y" .config; then
              sed -i "s/^${sym}=.*/${sym}=y/" .config
            else
              echo "${sym}=y" >> .config
            fi
          done

          make defconfig

          # 校验全量开关在 defconfig 之后仍然保留
          for sym in CONFIG_ALL_KMODS; do
            if grep -q "^${sym}=y" .config; then
              echo "✅ ${sym} 已启用（kmod=m $(grep -c '^CONFIG_PACKAGE_kmod-.*=m$' .config) 个）"
            else
              echo "::error::${sym} 未启用，Core_Kmod 包将缺少全量 kmod，终止编译！"
              exit 1
            fi
          done

          # 校验这两个符号在 defconfig 之后仍然保留（依赖不满足会被 defconfig 丢掉）
          for sym in CONFIG_PACKAGE_odhcp6c CONFIG_PACKAGE_luci-proto-ipv6; do
            if grep -q "^${sym}=y" .config; then
              echo "✅ ${sym} 已启用"
            else
              echo "::warning::${sym} 未启用，IPv6 可能无法获取地址"
            fi
          done

          # ========== 平台自检：配置文件必须与源码仓库的目标命名一致 ==========
          # coolsnowwolf/lede 的玩客云是 target=amlogic / subtarget=meson8b
          # 若 .config 里写的是其它源(如 ImmortalWrt 的 meson)的目标，make defconfig 会静默回退到 x86，白跑一小时
          OWRT_BOARD=$(grep -m1 '^CONFIG_TARGET_BOARD=' .config | cut -d'"' -f2)
          OWRT_SUBTARGET=$(grep -m1 '^CONFIG_TARGET_SUBTARGET=' .config | cut -d'"' -f2)
          echo "解析到的目标平台：${OWRT_BOARD} / ${OWRT_SUBTARGET}"
          if [ "${OWRT_BOARD}" != "amlogic" ] || [ "${OWRT_SUBTARGET}" != "meson8b" ]; then
            echo "❌ 致命错误：目标平台不是 amlogic/meson8b，与 ${OWRT_URL} 不匹配，终止编译！"
            exit 1
          fi
          echo "✅ 目标平台校验通过"

          make download -j$(( $(nproc) * 2 )) || true

          # ===== erofs-utils 源码包下载兜底 =====
          # tools/erofs-utils 的唯一源是 git.kernel.org 的 snapshot 包，
          # openwrt 各镜像(404)都没有缓存 erofs-utils-1.8.10.tar.gz；
          # git.kernel.org 对 GitHub Actions runner 抽风超时时整个编译必挂。
          # erofs/erofs-utils GitHub 镜像 v1.8.10 tag 包与 kernel.org snapshot
          # 字节级一致（sha256 同为 05eb4ede...14），此处直接兜底补齐。
          if [ ! -f dl/erofs-utils-1.8.10.tar.gz ]; then
            echo "⚠️ git.kernel.org 下载 erofs-utils 失败，改用 GitHub 镜像补齐"
            curl -fL --retry 3 --connect-timeout 20 \
              -o dl/erofs-utils-1.8.10.tar.gz \
              "https://codeload.github.com/erofs/erofs-utils/tar.gz/refs/tags/v1.8.10"
          fi

          make download -j1
          find dl -size -1k -exec rm -f {} \;

    - name: 编译固件
      working-directory: ./openwrt
      run: |
          echo -e "$(nproc) thread compile"
          make -j$(( $(nproc) + 1 )) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV 
        
    # === 修改处 1：获取内核版本 ===
    - name: 获取内核版本
      working-directory: ./openwrt
      run: |     
        KERNEL_PKG=$(find bin/targets/ \( -name "kernel_*.ipk" -o -name "kernel-*.apk" \) | head -n 1)
        if [ -n "$KERNEL_PKG" ]; then
          KERNEL_VER=$(echo "$KERNEL_PKG" | grep -oP 'kernel[-_]\K[0-9]+\.[0-9]+\.[0-9]+')
        else
          KERNEL_VER=$(grep -m 1 "KERNEL_PATCHVER" target/linux/amlogic/Makefile | cut -d '=' -f 2 | tr -d ' ')
        fi
        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER="unknown"
        fi
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "获取到的内核版本为: $KERNEL_VER"

    # 与 12/51 号同口径：产出 Core_Kmod-<内核版本>-<vermagic>.zip
    # 按官方 Supplementary Files 板级布局，只归档两个目录：
    #   repo/targets/<board>/<sub>/packages/                    ← distfeeds 的 core 源
    #   repo/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>/ ← distfeeds 的 kmods 源
    # base/luci/packages/routing/telephony 等应用源不打进包，设备端后续走第三方源
    - name: 打包Core+Kmod安装包(产出 Core_Kmod-<内核版本>-<哈希>.zip)
      working-directory: ./openwrt
      run: |
          # 1. 压缩包命名：Core_Kmod-<三段内核版本>-<哈希>.zip
          #    哈希优先取 kmods 目录名末尾的 vermagic（与 kernel 依赖串一致）；
          #    目录缺失时从 kernel_<ver>~<vermagic>-r1.ipk 文件名提取；
          #    仍取不到则兜底用源码 commit 前 32 位
          KVER3="${KERNEL_VER:-}"
          KMOD_HASH=""
          KMOD_DIR=$(find bin -type d -path "*kmods/*" | head -n 1)
          if [ -n "$KMOD_DIR" ]; then
            KMOD_BASE=$(basename "$KMOD_DIR")
            KMOD_HASH="${KMOD_BASE##*-}"
            [ -n "$KVER3" ] || KVER3="${KMOD_BASE%%-*}"
          fi
          if [ -z "$KMOD_HASH" ] || [ -z "$KVER3" ]; then
            KPKG=$(ls bin/targets/*/*/packages/kernel_*.ipk 2>/dev/null | head -n 1)
            if [ -n "$KPKG" ] && [ -f "$KPKG" ]; then
              KB=$(basename "$KPKG")
              if [ -z "$KVER3" ]; then
                KVER3=$(printf '%s' "$KB" | sed -nE 's/^kernel_([0-9]+\.[0-9]+\.[0-9]+)~.*$/\1/p')
              fi
              if [ -z "$KMOD_HASH" ]; then
                KMOD_HASH=$(printf '%s' "$KB" | sed -nE 's/^kernel_[0-9.]+~([0-9a-f]+)-r[0-9].*\.ipk$/\1/p')
              fi
            fi
          fi
          # 校验哈希为十六进制，否则回退
          case "$KMOD_HASH" in
            ""|*[!0-9a-f]*) KMOD_HASH=$(git rev-parse HEAD 2>/dev/null | cut -c1-32 || true) ;;
          esac
          # 二次校验：无 git 提交时 rev-parse 会输出 "HEAD"，此时用占位值
          case "$KMOD_HASH" in
            ""|*[!0-9a-f]*) KMOD_HASH="unknown" ;;
          esac
          [ -n "$KVER3" ] || KVER3="unknown"
          ZIP_NAME="Core_Kmod-${KVER3}-${KMOD_HASH}.zip"
          echo "安装包压缩包名: $ZIP_NAME"

          # 1.5 把 firmware 包补进 core：先落盘到 bin 源目录，第 2 步统一收集
          #     firmware 属 feeds/base（架构包），不由 bin/targets/<b>/<s>/packages 产出；
          #     而 kmod 依赖它们（如 kmod-rtl8822ce -> rtl8822ce-firmware），
          #     opkg 虽能强装，但不带固件时模块加载必然失败，所以随 core 一起归档。
          #     kmod-*firmware* 也一并收（属内核固件包），收集时按 kmod-* 前缀归入 kmods 目录。
          CORE_DIR=$(find bin/targets/*/*/packages -maxdepth 0 -type d 2>/dev/null | head -n 1 || true)
          if [ -n "$CORE_DIR" ]; then
            FW_ADDED=0
            while IFS= read -r f; do
              b=$(basename "$f")
              # 按包名（而非文件名）判重：同一包的两个版本同时进入 core 索引，
              # opkg 会解析出 duplicate package 或随机构建依赖树，必须避免
              stem=$(printf '%s' "$b" | sed -E 's/[-_][0-9][^-_]*[-_]r[0-9]+.*$//')
              if [ -e "$CORE_DIR/$b" ] || ls "$CORE_DIR" 2>/dev/null | grep -q "^${stem}[-_]"; then
                echo "  = firmware 已存在同名包，跳过: $b"
                continue
              fi
              if cp -f "$f" "$CORE_DIR/"; then
                FW_ADDED=$((FW_ADDED + 1))
                echo "  + firmware: $b"
              else
                echo "::warning::firmware 拷贝失败: $b"
              fi
            done < <(find bin/packages/*/base -maxdepth 1 -type f -name '*.ipk' 2>/dev/null | grep -i firmware)
            echo "已补入 core 的 firmware 包: $FW_ADDED 个（kmod 依赖的固件）"
          fi

          # 2. 只归档板级两目录（不收 bin/packages/<arch> 下的应用源包）
          #    唯一例外见上一步：kmod 依赖的 firmware 包已补进 core
          STAGE=/workdir/pkg_stage
          REPO="$STAGE/repo"
          rm -rf "$STAGE"
          mkdir -p "$REPO"
          COUNT=0
          KMOD_REL="kmods/${KVER3:-unknown}-1-${KMOD_HASH:-unknown}"
          for sub in packages kmods; do
            while IFS= read -r f; do
              rel=${f#bin/}
              b=$(basename "$f")
              case "$b" in
                kmod-*)
                  # 构建树把 kmod 与其它板级包一起输出在 bin/targets/<b>/<s>/packages/，
                  # 官方布局的 kmods/<ver>-1-<vermagic>/ 只有 release buildbot 才会生成，
                  # 这里按包名把 kmod 拆到 kmods 目录，与官方 Supplementary Files 保持一致
                  base=${rel%/packages/*}
                  if [ "$base" = "$rel" ]; then
                    base=${rel%/kmods/*}
                  fi
                  rel="$base/$KMOD_REL/$b"
                  ;;
              esac
              mkdir -p "$REPO/$(dirname "$rel")"
              cp -n "$f" "$REPO/$rel" 2>/dev/null || true
              COUNT=$((COUNT + 1))
            done < <(find bin/targets/*/*/"$sub" -type f -name "*.ipk" 2>/dev/null)
          done
          [ "$COUNT" -gt 0 ] || { echo "::error::未找到板级包（bin/targets/*/packages、*/kmods）"; exit 1; }
          echo "共收集 $COUNT 个安装包（板级 packages + kmods）"
          echo "=== 目录分布 ==="
          find "$REPO" -type f -name "*.ipk" -printf '%h\n' | sed "s|^$REPO/||" | sort | uniq -c

          # 2.5 去掉 ipk 文件名中的架构后缀（如 _arm_cortex-a5_vfpv4、_all），
          #     与 apk 包命名风格对齐；索引在下一步按暂存文件名重新生成，Filename 自动同步
          PKG_ARCH=$(find "$REPO" -type f -name '*.ipk' -printf '%f\n' 2>/dev/null \
            | sed -nE 's/^.*-r[0-9]+_//; s/\.ipk$//p' | grep -v '^all$' | sort | uniq -c | sort -rn | head -n 1 | awk '{print $2}')
          [ -n "$PKG_ARCH" ] || PKG_ARCH=$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\(.*\)"$/\1/p' .config | head -n 1)
          if [ -n "$PKG_ARCH" ]; then
            RENAMED=0
            while IFS= read -r f; do
              b=$(basename "$f")
              case "$b" in
                *_${PKG_ARCH}.ipk) stem=${b%_${PKG_ARCH}.ipk} ;;
                *_all.ipk)         stem=${b%_all.ipk} ;;
                *) continue ;;
              esac
              mv -f "$f" "$(dirname "$f")/$stem.ipk"
              RENAMED=$((RENAMED + 1))
            done < <(find "$REPO" -type f -name '*.ipk')
            echo "已去掉架构后缀(_${PKG_ARCH}/_all)的安装包: $RENAMED 个"
          else
            echo "::warning::未能确定目标架构，跳过去后缀"
          fi

          # 3. 逐目录生成 opkg 索引（索引与包同目录，Filename 用纯文件名）
          USIGN="$PWD/staging_dir/host/bin/usign"
          [ -x "$USIGN" ] || USIGN=$(command -v usign 2>/dev/null || true)
          SIGN_KEY="$PWD/key-build"
          CAN_SIGN=0
          if [ -n "$USIGN" ] && [ -x "$USIGN" ] && [ -s "$SIGN_KEY" ]; then
            CAN_SIGN=1
          else
            echo "::warning::未找到 usign 或 key-build，索引将不签名"
            echo "           （lede 固件的 zzz-default-settings 已删除 /etc/opkg.conf 的 check_signature，不签名可直接安装）"
          fi

          gen_opkg_index() {
            d="$1"
            ls "$d"/*.ipk >/dev/null 2>&1 || return 0
            : > "$d/Packages"
            for f in "$d"/*.ipk; do
              [ -e "$f" ] || continue
              b=$(basename "$f")
              ctl=$(tar -xzOf "$f" ./control.tar.gz 2>/dev/null | tar -xzOf - ./control 2>/dev/null) || ctl=""
              if [ -z "$ctl" ]; then
                echo "::warning::无法解析 control，跳过: $b"
                continue
              fi
              printf '%s\n' "$ctl" | awk -v fn="$b" -v sz="$(stat -c%s "$f")" -v sh="$(sha256sum "$f" | cut -d' ' -f1)" '
                /^Description:/ && !done { print "Filename: " fn; print "Size: " sz; print "SHA256sum: " sh; done=1 }
                { print }
                END { if (!done) { print "Filename: " fn; print "Size: " sz; print "SHA256sum: " sh } }' >> "$d/Packages"
              echo "" >> "$d/Packages"
            done
            if [ -s "$d/Packages" ]; then
              gzip -9nc "$d/Packages" > "$d/Packages.gz"
              if [ "$CAN_SIGN" = "1" ]; then
                "$USIGN" -S -m "$d/Packages" -s "$SIGN_KEY" >/dev/null 2>&1 \
                  || echo "::warning::索引签名失败: ${d#$REPO/}"
              fi
            fi
          }

          IDX_DIRS=0
          while IFS= read -r d; do
            gen_opkg_index "$d"
            # 只统计真正产出了索引的目录（find 会遍历到 repo、repo/targets 等空目录）
            [ -s "$d/Packages" ] && IDX_DIRS=$((IDX_DIRS + 1))
          done < <(find "$REPO" -type d | sort)
          IDX_PKGS=$(find "$REPO" -name Packages -type f -exec cat {} + 2>/dev/null | grep -c '^Package:' || true)
          echo "[OK] 已为 ${IDX_DIRS} 个目录生成索引，索引共收录 ${IDX_PKGS} 个包"

          # 4. 公钥 + 一键启用脚本（只会添加上面两个目录对应的源）
          if [ "$CAN_SIGN" = "1" ] && [ -s "$PWD/key-build.pub" ]; then
            cp -f "$PWD/key-build.pub" "$STAGE/key-build.pub"
          fi

          cat > "$STAGE/enable-local-repo.sh" <<'EOS'
          #!/bin/sh
          # 在路由器上执行： sh ./enable-local-repo.sh
          # 只添加本地 core 与 kmods 两条源；base/luci 等应用源另行处理，无需改动本脚本
          set -e
          BASE=$(cd "$(dirname "$0")" && pwd)
          CONF=/etc/opkg/customfeeds.conf
          touch "$CONF"
          if [ -f "$BASE/key-build.pub" ]; then
            mkdir -p /etc/opkg/keys
            FP=$(usign -F -p "$BASE/key-build.pub" 2>/dev/null || true)
            if [ -n "$FP" ]; then
              cp -f "$BASE/key-build.pub" "/etc/opkg/keys/$FP"
              echo "已导入公钥: /etc/opkg/keys/$FP"
            fi
          fi
          N=0
          for P in $(cd "$BASE" && find repo -name Packages -type f 2>/dev/null); do
            D=$(dirname "$P")
            grep -q "file://$BASE/$D" "$CONF" 2>/dev/null && continue
            N=$((N + 1))
            echo "src/gz local_${N}_$(basename "$D") file://$BASE/$D" >> "$CONF"
          done
          echo "已添加 $N 条本地源到 $CONF"
          echo "下一步：opkg update"
          echo "若报签名错误，请注释 /etc/opkg.conf 中的 option check_signature（lede 固件默认已注释）"
          EOS
          chmod +x "$STAGE/enable-local-repo.sh"

          cat > "$STAGE/README-PKG-REPO.txt" <<'EOF'
          lede 6.18 本地软件源（只含 core 板级包 + kmods 内核模块，共两个目录）
          ================================================================
          压缩包命名：Core_Kmod-<三段内核版本>-<哈希>.zip
          （哈希为内核 vermagic，与 opkg info kernel 输出中的串一致）
          本包与官方 Supplementary Files 中的 packages/、kmods/ 两个目录对应：
            repo/targets/<board>/<sub>/packages/                        ← distfeeds 的 core 源
            repo/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>/    ← distfeeds 的 kmods 源

          base / luci / packages / routing / telephony 等应用源【不在本包内】，
          请使用第三方源（lede 没有可用的官方 master 源，mirrors.tencent.com/lede 已过时），
          这样本地源与应用源没有同名包，不会互相覆盖。

          【一键启用】解压到路由器或挂载目录后执行：
              sh /mnt/usb/repo/enable-local-repo.sh
              opkg update

          【手动】在 /etc/opkg/customfeeds.conf 中加两条（与 distfeeds 写法一致）：
              src/gz local_core  file:///mnt/usb/repo/repo/targets/<board>/<sub>/packages
              src/gz local_kmods file:///mnt/usb/repo/repo/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>

          【局域网 HTTP 方式】把 repo/ 下的目录结构放到 Web 服务器根，例如：
              src/gz local_core  http://192.168.5.1/onecloud/lede/6.18/targets/<board>/<sub>/packages
              src/gz local_kmods http://192.168.5.1/onecloud/lede/6.18/targets/<board>/<sub>/kmods/<内核版本>-1-<vermagic>

          注意：
          1) kmod 目录名必须与本机内核完全一致（opkg info kernel 或 cat /proc/version 核对）；
          2) 不要 opkg install kernel（会覆盖运行中的内核）；
          3) lede 固件的 zzz-default-settings 默认已删除 check_signature，未签名索引可直接安装；
             若使用带 check_signature 的 opkg 配置，请先注释该行。
          EOF

          # 5. 压缩打包（安装包本身已压缩，使用存储模式加快速度）
          rm -f "/workdir/${ZIP_NAME}"
          (cd "$STAGE" && zip -q -0 -r "/workdir/${ZIP_NAME}" ./*)
          du -sh "/workdir/${ZIP_NAME}"
          # GitHub Release 单文件上限 2GiB，超限则提前报错
          ZIP_BYTES=$(stat -c%s "/workdir/${ZIP_NAME}")
          if [ "$ZIP_BYTES" -gt 2147483647 ]; then
            echo "::error::安装包压缩包超过 2GiB 上限，无法上传 Release"
            exit 1
          fi
          echo "PKG_ZIP=/workdir/${ZIP_NAME}" >> $GITHUB_ENV

          echo "status=success" >> $GITHUB_OUTPUT

    - name: 制作直刷包
      # 注意：这里不要再写 "|| true"。
      # convert2.sh 内部已做“去回读校验 + 成品自检”，一旦自检不通过就必须让
      # 整个 job 失败，否则会把烧录时必报“校验错误”的坏包上传到 Release。
      env:
          KEEP_VERIFY: '0'          # 0=去掉烧录后 SHA1 回读校验（解决“校验错误”）
          DROP_VERIFY_ITEMS: '1'    # 1=同时丢弃容器里的 VERIFY 项
          BOOT_SIZE_MB: '2000'      # boot 分区镜像大小，与原脚本保持一致
      run: |
            chmod +x $GITHUB_WORKSPACE/Scripts/convert2.sh
            dos2unix $GITHUB_WORKSPACE/Scripts/convert2.sh
            $GITHUB_WORKSPACE/Scripts/convert2.sh

    - name: 校验直刷包结构(防空包/防回退)
      run: |
          cd openwrt
          xzfile=$(find bin/targets -type f -name "*burn.img.xz" | head -n 1)
          [ -n "$xzfile" ] || { echo "::error::没有生成 burn.img.xz"; exit 1; }
          echo "成品: $xzfile"
          ls -lh "$xzfile" "$xzfile".sha 2>/dev/null || true
          # 解压后回读容器，确认里面没有 [LIST_VERIFY] / VERIFY 项
          cp -f "$xzfile" /tmp/verify.burn.img.xz
          unxz -f /tmp/verify.burn.img.xz
          $GITHUB_WORKSPACE/Scripts/convert2.sh check /tmp/verify.burn.img
          rm -f /tmp/verify.burn.img
          
    # === 修改处 2：重命名固件并整理格式（完全照抄你失败的工作流） ===
    - name: 整理固件
      id: organize
      run: |
        cd openwrt
        mkdir -p outfile
        
        # 1. 处理直刷包，强制使用标准命名并同步修改 sha
        for f in $(find bin/targets/ -type f -name "*.burn.img.xz"); do
          if [ -f "$f" ]; then
            NEW_XZ_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-onecloud-ext4-emmc.burn.img.xz"
            cp -f "$f" "./outfile/${NEW_XZ_NAME}"
            
            # 查找对应的 .sha 文件 (兼容 .xz.sha 和 .img.sha)
            SHA_FILE="${f}.sha"
            [ -f "$SHA_FILE" ] || SHA_FILE="${f%.xz}.sha"
            
            if [ -f "$SHA_FILE" ]; then
              NEW_SHA_NAME="${NEW_XZ_NAME}.sha"
              cp -f "$SHA_FILE" "./outfile/$NEW_SHA_NAME"
              # 修改内部记录的文件名为新名字
              sed -i "s|$(basename $SHA_FILE)|$NEW_SHA_NAME|g" "./outfile/$NEW_SHA_NAME"
              # 如果内部记录的是 xz 名字，也替换掉
              sed -i "s|$(basename $f)|$NEW_XZ_NAME|g" "./outfile/$NEW_SHA_NAME"
            fi
          fi
        done
        
        # 2. 查找并生成 rootfs 在线升级包
        FOUND_ROOTFS=$(find bin/targets/amlogic -type f -name "*rootfs.tar*" | head -n 1)
        if [ -n "$FOUND_ROOTFS" ]; then
          ROOTFS_NAME="OneCloud_${KERNEL_VER}_lede-amlogic-meson8b-thunder-rootfs.tar.gz"
          if [[ "$FOUND_ROOTFS" == *.gz ]]; then
            cp -f "$FOUND_ROOTFS" "./outfile/$ROOTFS_NAME"
          else
            gzip -c "$FOUND_ROOTFS" > "./outfile/$ROOTFS_NAME"
          fi
          echo "✅ 成功找到并处理了 rootfs 文件: $FOUND_ROOTFS"
        else
          echo "⚠️ 警告：在 bin/targets/ 中没有找到任何 rootfs.tar 文件！"
        fi

        # 2.5 复制 Core_Kmod 安装包压缩包（随 Release 一并上传，同 12/51）
        if [ -n "${PKG_ZIP}" ] && [ -f "${PKG_ZIP}" ]; then
          cp -f "${PKG_ZIP}" ./outfile/
          echo "✅ Core_Kmod 安装包已加入发布目录: $(basename ${PKG_ZIP})"
        else
          echo "::error::Core_Kmod 安装包不存在: ${PKG_ZIP}"
          exit 1
        fi

        cp -rf .config ./outfile/config.txt || true
        cd outfile
        
        if ls *.xz >/dev/null 2>&1; then
          echo "=== 检查最终上传的固件 ==="
          ls -lh
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        else
          echo "❌ 错误：没有找到任何 .burn.img.xz 固件！"
          exit 1
        fi
        echo "::set-output name=status::success"

        export OWRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
        export OWRT_SOURCE=$(echo $REPO_URL | cut -d '/' -f 5-)
        echo "OWRT_SOURCE=$OWRT_SOURCE" >> $GITHUB_ENV
        echo "OWRT_DATE=$OWRT_DATE" >> $GITHUB_ENV

    # === 修改处 3：上传 Release 时的 Tag 和显示信息（照抄你的失败工作流） ===
    - name: 上传直刷固件
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: Onecloud_${{ env.OWRT_SOURCE }}_${{ env.OWRT_DATE }}_kernel_${{ env.KERNEL_VER }}
        body: |
          自用玩客云一站式直刷固件！
          请使用双USB公头线刷机！
          ==========🧊 基本信息 🧊==========
          💻 固件源码： ${{env.OWRT_SOURCE}}
          💝 源码分支： ${{ env.OWRT_BRANCH }}
          🧠 内核版本： ${{ env.KERNEL_VER }}
          🔑 默认密码： password
          🌐 网络模式： 网口双栈自动获取
          📶 IPv4： lan 口 DHCP 客户端，地址由上级路由分配
          📶 IPv6： lan6 口 DHCPv6 客户端，向上游请求地址（含 PD 前缀）
          📡 查看地址： 登录主路由后台 → 客户端/在线设备列表 → 找主机名 OneCloud
          💡 提示： 上游需开启 DHCP / DHCPv6（光猫或路由的 IPv6 要放行），否则对应协议拿不到地址
          📦 Core+Kmod包： 板级 core + kmods 两个目录安装包（Core_Kmod-<内核版本>-<vermagic>.zip）
          🔐 离线源： 仅 core+kmods 两个本地目录（与官方Supplementary Files一致），base/luci 等应用源请使用第三方源
        artifacts: ${{ env.FIRMWARE }}/*
        
    - name: 清理Releases
      uses: rmoyulong/delete-older-releases@master
      with:
        keep_latest: 10
        delete_tags: true

    - name: 清理Workflows
      uses: rmoyulong/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 1
